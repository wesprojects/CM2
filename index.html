<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>CASEMAKER 2</title>
<style>
:root{--bg:#0d0f13;--panel:#151922;--panel2:#1b2130;--line:#2a3242;--ink:#e7ecf5;--mute:#7d8798;
 --amber:#f5a524;--blue:#78aaff;--green:#5ecf8d;--red:#ff6b6b;--mono:'DM Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.5 var(--mono);letter-spacing:.02em;
 overflow:hidden;height:100vh;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
header{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:15px;letter-spacing:.22em;font-weight:700}
header .build{color:var(--mute);font-size:9px;letter-spacing:.14em}
header .brand{margin-left:8px;flex:0 0 auto;line-height:0}
header .job{margin-left:6px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 9px;width:170px}
header select{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 8px}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer;letter-spacing:.1em;font-size:10px}
.btn:hover{border-color:var(--mute)}
.btn.on{background:var(--amber);border-color:var(--amber);color:#131313;font-weight:700}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.35;cursor:default}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:64px minmax(0,1fr) 6px var(--paneW,400px);position:relative}
#split{cursor:col-resize;background:var(--line);opacity:.55;transition:opacity .15s}
#split:hover,#split.on{opacity:1;background:var(--amber)}
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.rail button{width:44px;height:44px;border-radius:8px;background:transparent;border:1px solid transparent;cursor:pointer;
 color:var(--mute);font-size:9px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.rail button.on{background:var(--panel2);border-color:var(--line);color:var(--amber)}
.rail button.out.on{background:var(--panel2);border-color:var(--line);color:var(--amber)}
.rail .sep{width:28px;height:1px;background:var(--line);margin:6px 0}
.rail svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.tools{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);align-items:center}
.tools .hint{color:var(--mute);font-size:9.5px;letter-spacing:.08em;margin-left:8px}
#plan{flex:1;min-height:0;position:relative}
#plan svg{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);overflow:visible}
#partsView{flex:1;min-height:0;overflow:auto;padding:16px;display:none}
#partsView table{width:100%;border-collapse:collapse;font-size:11px}
#partsView th{text-align:left;font-size:9px;letter-spacing:.14em;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line)}
#partsView td{padding:5px 8px;border-bottom:1px solid var(--line)}
#partsView td.act{white-space:nowrap;text-align:right}
#partsView .btn.sm{padding:3px 8px;font-size:9px;margin-left:4px}
.stagefoot{display:flex;gap:10px;padding:8px 16px;border-top:1px solid var(--line);font-size:9px;color:var(--mute);letter-spacing:.1em}
.chip{border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:var(--panel)}
.side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.side .hd{padding:12px 16px 9px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.side .hd .k{font-size:11px;letter-spacing:.16em;color:var(--amber)}
.side .hd .s{color:var(--mute);font-size:10px;margin-top:2px}
.side .body{padding:12px 16px;overflow:auto;flex:1 1 auto;min-height:0}
.side .iso{border-top:1px solid var(--line);padding:10px 16px 14px;flex:0 0 auto}
.grp{margin-bottom:14px}
.grp>.t{font-size:9px;letter-spacing:.16em;color:var(--mute);margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:9px;color:var(--mute);letter-spacing:.08em}
label.f input,label.f select{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:11px;width:100%}
label.f .mm{color:var(--mute);font-size:9px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:7px 4px;cursor:pointer;font-size:9.5px;letter-spacing:.08em;color:var(--mute)}
.seg button.on{background:var(--amber);color:#131313;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(6,8,12,.78);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:min(96vw,1180px);max-height:92vh;overflow:auto;padding:18px 22px;width:100%}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mhead h2{margin:0;font-size:14px;letter-spacing:.2em}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sec{border:1px solid var(--line);border-radius:8px;padding:12px}
.sec h3{margin:0 0 8px;font-size:9px;letter-spacing:.16em;color:var(--amber)}
.sec input,.sec select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 9px}
.sec .mm{color:var(--mute);font-size:9px;margin-top:4px}
.flyout{position:absolute;left:64px;top:0;bottom:0;width:360px;background:var(--panel);border-right:1px solid var(--line);
 box-shadow:14px 0 30px rgba(0,0,0,.45);transform:translateX(-380px);transition:transform .18s ease,visibility 0s .18s;z-index:15;display:flex;flex-direction:column;visibility:hidden;pointer-events:none}
.flyout.open{transform:translateX(0);visibility:visible;pointer-events:auto;transition:transform .18s ease}
.flyout .fh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.flyout .fh .t{font-size:12px;letter-spacing:.2em;color:var(--amber);font-weight:700}
.flyout .fh .s{font-size:9px;letter-spacing:.1em;color:var(--mute);margin-top:2px}
.flyout .fh>div:first-child{min-width:0;margin-right:10px}
.flyout .fb{padding:14px 16px;overflow:auto;flex:1}
.flyout .note{font-size:10px;color:var(--mute);line-height:1.5;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;margin-top:10px}
.flyout .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.update{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--amber);color:#131313;display:flex;align-items:center;gap:14px;
 padding:8px 18px;font-size:11px;letter-spacing:.1em;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.4);transform:translateY(-110%);transition:transform .25s ease}
.update.show{transform:translateY(0)}
.update .btn{background:#131313;color:var(--amber);border-color:#131313}
.update .x{margin-left:auto;background:transparent;border:0;color:#131313;font-size:14px;cursor:pointer}
.hit{cursor:pointer}
.hit rect{pointer-events:all}
.rz:hover rect{stroke:var(--amber);stroke-width:1.5;fill:rgba(245,165,36,.14)}
</style></head>

     CORE   (inlined from core.mjs: units, model, spaces, drawers, parts, presets)

/* ============================================================================
   8  JOINERY
   Every part gets a drawing FRAME: origin o (world), ux and uy (world unit vectors of the drawing's
   x and y), ax (which world axis is the thickness), shown (world coordinate of the face that is drawn)
   and opp (the other face). Holes are stored in drawing coordinates:
     { type, x, y, d, z, edge, zo, under }
     edge  = true for a hole drilled into an edge (x or y sits on the outline)
     zo    = an edge hole's distance from the SHOWN face, through the thickness
     under = a face hole on the OPP face rather than the shown one
   A butt joint puts CAM (face) + PIN (edge) + DOWEL (edge) holes in the butting part and matching
   PIN/DOWEL face holes in the receiving part. The receiving holes are placed by transforming the
   butting part's pin-line into world space and back into the receiver's frame, so the two can only
   disagree if the geometry does - which the audit checks.
   ============================================================================ */
const JOINERY = {
  camD: 0.5906, camZ: 0.5,                 // cam bore Ø15, 12.7 deep (+ slot allowance)
  pinED: 0.3125, pinEZ: 1.25, pinFD: 0.375, pinFZ: 0.4724,   // pin: edge Ø, edge depth (blank = auto: inset + 0.1181), face insert Ø, face depth
  dowD: 0.3125, dowEZ: 0.75, dowFZ: 0.5118,      // dowel Ø, edge depth, face depth
  slot: 0.315, ctr: 0.3875,                // nut slot from nut top; pin line from the cam face
  inset: 1.3386,                           // cam centre from the butting edge (34 mm pin)
  camSp: 20, pat: 'beside', dowOff: 1.2598, dowN: 1, front: 2, back: 2,
  camDividers: true, camShelves: true, camBack: true, dowSp: 8,
  glide: { on: true, where: 'sides', type: 'glide', D: 0.3937, Z: 0.4724, inY: 1.5 },   // levelling glides in the side panels' bottom edges
  hinge: { cupD: 1.378, cupZ: 0.4843, K: 1.1024, screwD: 0.1969, screwZ: 0.4, cupScrewSp: 45 / 25.4,

/* ---- frames ---- */

/* edge: 'L' | 'R' (x = 0 / w, stations along y) or 'F' | 'B' (y = 0 / h, stations along x)

/* ---- shelf pin ladders on a face, over a z range, on one pin grid measured from the floor ---- */

/* ---- hinges: cups in the door, plates in whatever carries it ---- */

/* ============================================================================

/* ---------- 3  MODEL ---------- */
function newCase(over = {}) {

/* ---------- 4  SPACES ---------- */
/* A space is bounded by the carcass and by whatever shelves and dividers span it.

function spaces(M) {

  const ceil  = M.top === 'none' ? M.H : r4(M.H - T);

                                   s.x0 <= r.x0 + 0.01 && s.x1 >= r.x1 - 0.01);
    /* the region below the shelf has the shelf OVER it; the region above has it UNDER */
    if (sh) { cut({ ...r, z1: sh.z, over: sh.id }, depth + 1);

    const dv = M.dividers.find(d => d.x - T / 2 > r.x0 + 0.01 && d.x + T / 2 < r.x1 - 0.01 &&
                                    d.z0 <= r.z0 + 0.01 && d.z1 >= r.z1 - 0.01);
    if (dv) { cut({ ...r, x1: r4(dv.x - T / 2), rightOf: r.rightOf, leftOf: dv.id }, depth + 1);

    res.push(r);

  res.sort((a, b) => a.z0 - b.z0 || a.x0 - b.x0);

  res.forEach(c => {

/* ---------- 5  DRAWERS ----------

   The box is sized from the opening less the slide clearance per side, so slide

  const faceZ1 = space.z1 >= ceil - 0.01 && !topProud ? r4(M.H - O.topGap) : space.z1;

    if (Math.abs(z + fh - faceZ1) < 0.5) { z = r4(faceZ1 - fh); anchor = anchor ? 'BOTH' : 'TOP'; }

    { partId: s.id, frame: { o: [s.x0, M.frontY, 0], ux: [1, 0, 0], uy: [0, 1, 0], ax: 2, shown: s.z, opp: r4(s.z + T) } }));   // cam nuts underneath
  M.dividers.forEach((d, i) => P('DIVIDER ' + (i + 1), r4(d.z1 - d.z0), fD, T,
    { min: [r4(d.x - T / 2), M.frontY, d.z0], max: [r4(d.x + T / 2), backY, d.z1] },
    { partId: d.id, frame: { o: [0, M.frontY, d.z0], ux: [0, 0, 1], uy: [0, 1, 0], ax: 0, shown: r4(d.x - T / 2), opp: r4(d.x + T / 2) } }));   // left face

  spaces(M).forEach(c => {
    const b = bayOf(M, c.key);
    const O = M.opt.shelf;
    for (let i = 1; i <= b.shelves; i++) {
      const want = c.z0 + (c.z1 - c.z0) * i / (b.shelves + 1);
      const k = Math.round((want - O.pinDia / 2 - O.pinFirst) / O.pinPitch);   // nearest pin row
      const z = r4(Math.min(Math.max(O.pinFirst + k * O.pinPitch + O.pinDia / 2, c.z0 + 1), c.z1 - T - 1));
      P('ADJ SHELF', r4(c.w - 2 * O.sideClear), r4(backY - Math.max(O.frontGap, M.frontY || 0)), T,
        { min: [r4(c.x0 + O.sideClear), Math.max(O.frontGap, M.frontY || 0), z], max: [r4(c.x1 - O.sideClear), backY, r4(z + T)] }, { forBay: c.key });
    }
    if (b.content === 'drawers') drawerStack(M, c, b).forEach(p => out.push(p));
    if (b.content === 'door' || b.content === 'doors2') emitDoors(c, b, false);   // its band is excluded from the case doors, so it keeps its own style
  });
  /* doors over the whole case - hinged on the case sides. A compartment that already has
     its own door keeps it: the case doors cover only the regions without one. At a shelf
     between regions, inset doors reach over the shelf's front band; overlay doors half-lap
     the shelf from its centreline like any overlay door. */
  if (caseDoors) {
    const Cs = spaces(M);
    const floorZ2 = M.bottom === 'none' ? M.kick : r4(M.kick + (M.caseBottomT || T));
    const ceilZ2 = M.top === 'none' ? M.H : r4(M.H - T);
    const zb = [...new Set([floorZ2, ceilZ2, ...Cs.flatMap(q => [r4(q.z0), r4(q.z1)])])].sort((x, y) => x - y);
    const kind = mid => { const hit = Cs.filter(q => q.z0 <= mid && q.z1 >= mid);
      if (!hit.length) return 'shelf';
      return hit.some(q => { const bb = bayOf(M, q.key); return bb.content === 'door' || bb.content === 'doors2'; }) ? 'doored' : 'open'; };
    let lo = null, hi = null;
    const flush = () => { if (lo == null) return;
      if (hi - lo > 2) emitDoors({ x0: T, x1: r4(M.W - T), z0: lo, z1: hi, key: 'CASE' }, CB, false,
        { loInt: lo > floorZ2 + 0.01, hiInt: hi < ceilZ2 - 0.01 });
      lo = hi = null; };
    for (let i = 0; i < zb.length - 1; i++) {
      const k2 = kind((zb[i] + zb[i + 1]) / 2);
      if (k2 === 'open') { if (lo == null) lo = zb[i]; hi = zb[i + 1]; }
      else if (k2 === 'doored') flush();
      /* a bare shelf band neither starts nor ends a region - it sits inside one */
    }
    flush();
  }
  applyJoinery(M, out);
  return out;

  /* INSET (default): flush in the opening, clearance all round - 16 mm crank hinges.
     OVERLAY: applied on the front - full side covered at a case edge (0 mm crank),
     half a divider covered where two doors share it (9.5 mm crank).
     Each edge gap can be overridden; blank means the global default. A door inside a
     case that itself has doors is forced inset, behind the case-door plane.          */
  function emitDoors(c, b, behindCaseDoors, edge) {
    edge = edge || {};
    const O2 = M.opt.door, n = b.content === 'doors2' ? 2 : 1;
    let style = (b.doorStyle && b.doorStyle !== 'auto') ? b.doorStyle : (O2.style || 'inset');
    if (behindCaseDoors) style = 'inset';
    const rv = style === 'inset' ? O2.insetClear : O2.reveal;
    const dc = b.doorClr || {}, pk = v => (v == null || isNaN(v)) ? null : v;
    const gL = pk(dc.l) ?? rv, gR = pk(dc.r) ?? rv, gT = pk(dc.t) ?? rv, gB = pk(dc.b) ?? rv, gM = pk(dc.m) ?? rv;
    const dT = r4(O2.thickness || T);
    let x0, x1, z0, z1, yMin, yMax;
    if (style === 'inset') {
      x0 = r4(c.x0 + gL); x1 = r4(c.x1 - gR);
      z0 = r4(c.z0 - (edge.loInt ? T : 0) + gB);                                // an internal edge: reach over the shelf's front band
      z1 = r4(c.z1 + (edge.hiInt ? T : 0) - gT);
      yMin = behindCaseDoors ? M.frontY : 0; yMax = r4(yMin + dT);            // flush with the front it belongs to
    } else {
      const touchL = Math.abs(c.x0 - T) < 0.01, touchR = Math.abs(c.x1 - (M.W - T)) < 0.01;
      x0 = touchL ? gL : r4(c.x0 - T / 2 + gL / 2); x1 = touchR ? r4(M.W - gR) : r4(c.x1 + T / 2 - gR / 2);
      const ceilZ = M.top === 'none' ? M.H : r4(M.H - T), floorZ = M.bottom === 'none' ? M.kick : r4(M.kick + (M.caseBottomT || M.T));
      z1 = c.z1 >= ceilZ - 0.01 ? r4(M.H - (pk(dc.t) ?? 0)) : r4(c.z1 + T / 2 - gT / 2);   // to the very top unless told otherwise
      z0 = c.z0 <= floorZ + 0.01 ? (pk(dc.b) != null ? r4(M.kick + dc.b) : (O2.bottomZ != null ? O2.bottomZ : r4(M.kick + rv))) : r4(c.z0 - T / 2 + gB / 2);
      yMin = -dT; yMax = 0;
    }
    const w = r4((x1 - x0 - (n - 1) * gM) / n);
    for (let i = 0; i < n; i++) { const dx0 = r4(x0 + i * (w + gM));
      P(n === 2 ? 'DOOR ' + (i ? 'R' : 'L') : 'DOOR', w, r4(z1 - z0), dT,
        { min: [dx0, yMin, z0], max: [r4(dx0 + w), yMax, z1] },
        { hingeEdge: (n === 2 ? (i ? 'R' : 'L') : (b.hinge || 'L')), doorFor: c.key, doorStyle: style,
          frame: { o: [dx0, 0, z0], ux: [1, 0, 0], uy: [0, 0, 1], ax: 1, shown: yMax, opp: yMin } }); }   // drawn from the inside face
  }
}

function loadPreset(name) {
  const p = PRESETS[name]; if (!p) return newCase();
  const pinCampin = M2 => { M2.hwModels = M2.hwModels || {};                   // the samples run the 32 mm bolt line, same as new work
    M2.hwModels.campin = [
      { name: 'HAFELE SPREADING BOLT B32', mcm: '262.09.302', dims: { B: 1.2598 } },
      { name: 'HAFELE SPREADING BOLT B34', mcm: '262.09.302', dims: { B: 1.3386 } }];
    M2.hwModels.pull = [
      { name: 'MCMASTER 6\u2033 RECT PULL', mcm: '15145A61', dims: { cc: 6, holeD: 0.1875, off: 1.1811, len: 6.25, proj: 1.5, barW: 0.5, screw: '#8-32' } },
      { name: 'WIRE PULL 128 MM CC', mcm: '' }];
    (M2.hwDefault = M2.hwDefault || {}).campin = 0; M2.hwDefault.pull = 0; return M2; };
  const M = newCase({ W: p.W, H: p.H, D: p.D, T: p.T, backT: p.backT,
                      kick: p.kick, bottom: p.bottom || 'between',
                      topFront: p.topFront === 'flush' ? p.T : (p.topFront || 0), topEnds: p.topEnds || 0 });

  if (p.drawers) { b.content = 'drawers'; b.drawers = { ...p.drawers }; b.heights = p.heights || []; if (p.align) b.align = p.align;
    if (p.boxHeights) b.boxHeights = p.boxHeights; }
  if (p.boxSlide) M.opt.drawer.boxSlide = p.boxSlide;
  M.opt.shelf.pinFront = p.pinFront != null ? p.pinFront : 2;               // the samples are built product: 2" stands unless a drawing says otherwise
  M.opt.shelf.pinBack = p.pinBack != null ? p.pinBack : 2;
  if (p.backEdge) M.backEdge = p.backEdge;
  if (p.caseBottomT) M.caseBottomT = p.caseBottomT;
  if (p.boxFaceT) M.opt.drawer.boxFaceT = p.boxFaceT;
  if (p.fileFaceT) M.opt.drawer.fileFaceT = p.fileFaceT;                          // the product's own slides and reveals

/* ---------- 9  APPLY JOINERY ----------
   The joint set is v1's: sides into the top (or the top into the sides), bottom into the sides and the
   back, back into the sides and the top, kick into the sides and dowelled up into the bottom, fixed
   shelves into whatever carries their ends and into the back, dividers into whatever they stand on and
   meet and into the back, shelf-pin ladders on the faces that carry adjustable shelves, hinge cups in
   doors and plates in their carriers. Drawer boxes carry grooves only, as in v1.                  */
function applyJoinery(M, out) {
  const cpIdx = M.camPinModel != null ? M.camPinModel : ((M.hwDefault || {}).campin || 0);
  const cpDims = M.hwModels && M.hwModels.campin && M.hwModels.campin[cpIdx] && M.hwModels.campin[cpIdx].dims;
  setCampinB(cpDims && cpDims.B ? cpDims.B : null);                            // the picked spreading bolt sets the cam-nut line
  const J = M.opt.joinery || JOINERY, T = M.T, by = n => out.find(p => p.name === n);
  const bx = M.back !== 'none' ? r4(J.inset + J.camD / MM) : 0;   // keep back-panel cams clear of the side-joint cams at the corners
  const L = by('LEFT SIDE'), R = by('RIGHT SIDE'), TOP = by('TOP'), BOT = by('BOTTOM'), BK = by('BACK PANEL'), KICK = by('KICK BOARD');
  const dow = { dowelsOnly: true, dowSp: J.dowSp };
  const shelves = out.filter(p => p.name.startsWith('FIXED SHELF')), dividers = out.filter(p => p.name.startsWith('DIVIDER'));
  const carrierAtLeft = x => Math.abs(x - T) < 0.01 ? L : dividers.find(d => Math.abs(d.box.max[0] - x) < 0.01);      // part whose right face is at x
  const carrierAtRight = x => Math.abs(x - (M.W - T)) < 0.01 ? R : dividers.find(d => Math.abs(d.box.min[0] - x) < 0.01); // part whose left face is at x
  const under = z => (BOT && Math.abs(BOT.box.max[2] - z) < 0.01) ? BOT : shelves.find(s => Math.abs(s.box.max[2] - z) < 0.01);
  const over  = z => (TOP && Math.abs(TOP.box.min[2] - z) < 0.01) ? TOP : shelves.find(s => Math.abs(s.box.min[2] - z) < 0.01);
  out.forEach(p => { p.holes = p.holes || []; p.lines = p.lines || []; });

  /* top */
  if (TOP && M.top === 'over') { butt(L, 'R', TOP, J); butt(R, 'R', TOP, J); }
  else if (TOP) { butt(TOP, 'L', L, J); butt(TOP, 'R', R, J); }
  /* bottom */
  if (BOT) { butt(BOT, 'L', L, J); butt(BOT, 'R', R, J);
    if (BK) butt(BOT, 'B', BK, J, { ...(J.camBack ? {} : dow), range: [bx, r4(BOT.w - bx)] }); }
  /* back: drawn mirrored, so its L edge is at the right side of the case */
  if (BK) { const jb = J.camBack ? {} : dow; butt(BK, 'L', R, J, jb); butt(BK, 'R', L, J, jb);   // the ends run along the height - that axis is not mirrored
    if (TOP) butt(BK, 'B', TOP, J, { ...jb, range: [bx, r4(BK.w - bx)], dowMirror: true }); }   // the top edge's axis runs opposite the case
  /* kick: ends into the sides, top edge dowelled into the bottom */
  if (KICK) { butt(KICK, 'L', R, J); butt(KICK, 'R', L, J); if (BOT) butt(KICK, 'B', BOT, J, { ...dow, dowSp: 12 }); }
  /* fixed shelves */
  shelves.forEach(sh => { const js = J.camShelves ? {} : dow;
    const cl = carrierAtLeft(sh.box.min[0]), cr = carrierAtRight(sh.box.max[0]);
    if (cl) butt(sh, 'L', cl, J, js); if (cr) butt(sh, 'R', cr, J, js);
    if (BK && J.camBack !== false) butt(sh, 'B', BK, J, { ...js, range: [bx, r4(sh.w - bx)] }); });
  /* dividers */
  dividers.forEach(dv => { const jd = J.camDividers ? {} : dow;
    const u = under(dv.box.min[2]), o = over(dv.box.max[2]);
    if (u) butt(dv, 'L', u, J, jd); if (o) butt(dv, 'R', o, J, jd);
    if (BK) butt(dv, 'B', BK, J, { ...jd, range: [bx, r4(dv.w - bx)] }); });
  /* glides in the sides' bottom edges - centred in the thickness, so they carry their own zo */
  const G = J.glide || JOINERY.glide;
  const glideOff = !G || G.on === false || G.type === 'none';
  if (!glideOff && G.where === 'sides') { const pin = G.type === 'pin';
    const gd = pin ? J.pinED : G.D, gz = pin ? pinEdgeDepth(J) : G.Z;
    [L, R].forEach(sp => { if (!sp) return;
      [G.inY, r4(sp.h - G.inY)].forEach(y => addHole(sp, 'GLIDE', 0, y, gd, gz, true, r4(sp.t / 2))); }); }
  if (!glideOff && G.where === 'bottom' && BOT) {                     // casters or glides bolted to the underside
    const ix = G.inX || G.inY, iy = G.inY;
    [[ix, iy], [r4(BOT.w - ix), iy], [ix, r4(BOT.h - iy)], [r4(BOT.w - ix), r4(BOT.h - iy)]]
      .forEach(([x, y]) => addHole(BOT, 'GLIDE', x, y, G.D, G.Z)); }
  /* shelf pins */
  const O = M.opt.shelf;
  spaces(M).forEach(c => { const b = bayOf(M, c.key); if (!b.shelves) return;
    const zs = adjShelfZ(M, c, b.shelves), rows = b.rows && b.rows !== 'auto' ? b.rows : (O.pinRows || 'all');
    const cl = carrierAtLeft(c.x0), cr = carrierAtRight(c.x1);
    const zr = [c.z0, r4(c.z1 - (O.pinTopClear || 3))];                                          // v1: no clearance below, 3" under the ceiling
    if (cl) pinLadder(cl, O, zr, cl.name !== 'LEFT SIDE', rows, zs);                             // a divider's RIGHT face is its far face
    if (cr) pinLadder(cr, O, zr, false, rows, zs); });
  /* hinges */
  const H = M.opt.joinery ? (M.opt.joinery.hinge || JOINERY.hinge) : JOINERY.hinge;
  out.filter(p => p.name.startsWith('DOOR')).forEach(door => {
    const bayH = M.bays[door.doorFor] || {};
    const kindCat = (door.hingeKind || '').indexOf('HALF') === 0 ? 'hingehalf' : (door.hingeKind || '').indexOf('INSET') === 0 ? 'hingeinset' : 'hingefull';
    const hIdx = bayH.hingeModel != null ? bayH.hingeModel : ((M.hwDefault || {})[kindCat] || 0);
    const hDims = M.hwModels && M.hwModels[kindCat] && M.hwModels[kindCat][hIdx] && M.hwModels[kindCat][hIdx].dims;
    const H2 = hDims && hDims.cupZ ? { ...H, cupZ: hDims.cupZ, cupD: hDims.cupD || H.cupD } : H;
    const ys = hingeCups(door, H2, bayH.hinges, bayH.hingeEnd);
    const pIdx = bayH.pullModel != null ? bayH.pullModel : ((M.hwDefault || {}).pull || 0);
    const pDims = M.hwModels && M.hwModels.pull && M.hwModels.pull[pIdx] && M.hwModels.pull[pIdx].dims;
    if (pDims && pDims.cc) {                                                    // the handle: opposite the hinge, vertical, centred
      const pOff = pDims.off || 1.1811;                                         // 30 mm off the edge
      const px = door.hingeEdge === 'L' ? r4(door.w - pOff) : r4(pOff);
      [r4(door.h / 2 - pDims.cc / 2), r4(door.h / 2 + pDims.cc / 2)].forEach(py =>
        addHole(door, 'PULL', px, py, pDims.holeD || 0.1875, door.t)); }        // through, for the machine screws
    const hx = door.hingeEdge === 'L' ? door.box.min[0] : door.box.max[0];
    const carrier = door.hingeEdge === 'L' ? (carrierAtLeft(r4(hx + T / 2)) || carrierAtLeft(r4(hx + T))) : (carrierAtRight(r4(hx - T / 2)) || carrierAtRight(r4(hx - T)));
    const cands = [L, R, ...dividers].filter(Boolean).map(q => ({ q, d: Math.min(Math.abs(q.box.min[0] - hx), Math.abs(q.box.max[0] - hx)) })).sort((a, b) => a.d - b.d);
    const car = carrier || (cands[0] && cands[0].d < 1.5 ? cands[0].q : null);
    const bay2 = M.bays[door.doorFor] || {};
    const ovr = { full: 'FULL OVERLAY (0 MM CRANK)', half: 'HALF OVERLAY (9.5 MM CRANK)', inset: 'INSET (16 MM CRANK)' };
    door.hingeKind = door.doorStyle === 'inset' ? ovr.inset :
      (bay2.hingeType && bay2.hingeType !== 'auto') ? ovr[bay2.hingeType] :
      (car && car.name.startsWith('DIVIDER')) ? ovr.half : ovr.full;            // two doors share a divider: each covers half of it
    if (car) hingePlates(car, door, ys, H); });
  /* drawer slide pilots: when the picked slide model carries its measured hole pattern,
     drill No. 8 pilots in the panels either side, on the slide centreline, at the
     cabinet-member web holes (positions measured off the McMaster STEP).            */
  out.filter(q => q.role === 'slide' && q.slideDims && q.slideDims.caseHoles).forEach(sl => {
    const rear = r4(sl.mountY0 + sl.mountLen);
    [[sl.mountX[0], 'max'], [sl.mountX[1], 'min']].forEach(([x, side]) => {
      const p = out.find(q => q.box && q.frame && Math.abs(q.box[side][0] - x) < 0.02 &&
        q.box.min[2] <= sl.mountZ && q.box.max[2] >= sl.mountZ && (q.name.endsWith('SIDE') || q.name.startsWith('DIVIDER')));
      if (!p) return;
      sl.slideDims.caseHoles.forEach(d => { const wy = r4(rear - d); if (wy < sl.mountY0 - 0.01) return;
        const [hx, hy] = toDrawing(p, [x, wy, sl.mountZ]);
        addHole(p, 'SCREW', r4(hx), r4(hy), 0.125, 0.5); }); });
  });
  /* closet rods: a pocket in each panel that bounds the compartment, facing each other.
     Style A: stadium flange standing VERTICAL - rod on the lower arc centre, the tail and
     its screw straight above, so the cradle opens up and the rod drops in.
     Style B: round cup, rod axis at the centre, screws above it. */
  spaces(M).forEach(cc => { const b = bayOf(M, cc.key); if (!b.rod) return;
    const ST = ROD.styles[b.rodStyle === 'B' ? 'B' : 'A'];
    const r = ST.R, pz = ST.pocketZ, up = ST.shape === 'stadium' ? ST.c2c : 0;   // headroom above the rod axis
    const bkIn2 = M.backEdge === 'flush' ? 0 : mm(1);
    const yLo = M.frontY || 0, yHi = M.back === 'none' ? M.D : r4(M.D - M.backT - bkIn2);
    let zc = r4(cc.z1 - (b.rodBelow != null ? b.rodBelow : ROD.belowTop));
    zc = r4(Math.min(Math.max(zc, cc.z0 + r + 0.1), cc.z1 - up - r - 0.1));      // flange stays inside the space

function trueViews(list) {

    const n = [0, 0, 0]; n[f.ax] = Math.sign(f.shown - f.opp) || 1;
    const c = [f.ux[1] * f.uy[2] - f.ux[2] * f.uy[1], f.ux[2] * f.uy[0] - f.ux[0] * f.uy[2], f.ux[0] * f.uy[1] - f.ux[1] * f.uy[0]];
    if (c[0] * n[0] + c[1] * n[1] + c[2] * n[2] > 0) return;                     // already a true view
    p.mirrored = true;                                                           // remembered for the panel viewer's note
    (p.holes || []).forEach(h => { h.x = r4(p.w - h.x); });
    (p.lines || []).forEach(l => { l.x1 = r4(p.w - l.x1); l.x2 = r4(p.w - l.x2); });
    (p.voids || []).forEach(v => { v.ring = v.ring.map(q => [r4(p.w - q[0]), q[1]]).reverse(); });
    f.o = [0, 1, 2].map(i => f.o[i] + p.w * f.ux[i]); f.ux = f.ux.map(v => -v);  // keep world positions identical

function sanitizeFilename(name){
  return (name || '').trim().replace(/[^a-zA-Z0-9_\-]+/g, '_').replace(/^_+|_+$/g, '');
}

/* ---- CNC #1 program generator, lifted from camlock_generator.html. Pure: state is set from the params. ---- */
let state = { FRONT: [], LEFT: [], BACK: [], RIGHT: [] }, faceHoles = [];
const PLANE_TOOLPATH_DIRECTION = { FRONT: 'desc', LEFT: 'asc', BACK: 'asc', RIGHT: 'desc' };
function serializeHole(h){
  const hasZ = h.z != null;
  if (h.type === 'dowel' || hasZ){
    const o = { p: h.pos };
    if (h.type === 'dowel') o.t = 'dowel';
    if (hasZ) o.z = h.z;
    return o;
  }
  return h.pos;
}
function cnc1Program(params) {
  if (params.totalOffset == null) params.totalOffset = (params.toolOffset || 0) + (params.bitOffset || 0);
  const de = h => typeof h === 'object' ? { pos: h.p, type: h.t || 'cam', z: h.z } : { pos: h, type: 'cam' };
  state = { FRONT: (params.holes.FRONT || []).map(de), LEFT: (params.holes.LEFT || []).map(de),
            BACK: (params.holes.BACK || []).map(de), RIGHT: (params.holes.RIGHT || []).map(de) };
  faceHoles = (params.faceHoles || []).map(h => ({ x: h.x, y: h.y, type: h.t || 'cam' }));
  return computeProgram(params);
}
function fmt(n){
  if (n === '' || n === null || isNaN(n)) return '0';
  let v = Math.round(parseFloat(n) * 100000) / 100000;
  return v.toString();
}
function nowStamp(){
  const d = new Date();
  const p2 = (v) => String(v).padStart(2, '0');
  const dd = p2(d.getDate());
  const mm = p2(d.getMonth() + 1);
  const yyyy = d.getFullYear();
  const HH = p2(d.getHours());
  const MI = p2(d.getMinutes());
  const SS = p2(d.getSeconds());
  return `${dd}-${mm}-${yyyy} ${HH}:${MI}:${SS}`;
}
function edgeRefValue(plane, s){
  if (plane.edgeRefKey === 'zero') return 0;
  if (plane.edgeRefKey === 'length') return s.panelLength;
  return s.panelWidth;
}

// Returns physical (real-world) coordinates: where the drill tip actually is,
// not the programmed/controller coordinate (which is offset from the tip by tool offset).
// entry = tip position at the panel edge (depth 0). deep = tip position at full hole depth.
function holeDepthFor(hole, s){
  return hole && hole.type === 'dowel' ? s.holeDepthDowel : s.holeDepth;
}

// Effective drill Z for one hole: the hole's own Z if set, otherwise the global drill Z.
// globalDrillZ is computed once in computeProgram (override value, or thickness/2).
function holeDrillZ(hole, globalDrillZ){
  return (hole && hole.z != null) ? hole.z : globalDrillZ;
}

// Serialize a hole for the .nc PARAMS block. Cam holes (the default) save as a plain number so
// existing files and simple jobs stay compact; only dowel holes need the {p, t} object form.
function toolpathOrderedHoles(planeName){
  const dir = PLANE_TOOLPATH_DIRECTION[planeName] || 'asc';
  const holes = state[planeName];
  return [...holes].sort((a, b) => dir === 'desc' ? b.pos - a.pos : a.pos - b.pos);
}

// A hole's drilling depth depends on its type: 'dowel' holes use the dowel depth, everything
// else (default 'cam') uses the cam depth. Defined here so g-code and every visualization
// resolve depth the same way.
function getFilename(s){
  const raw = (s && s.jobName !== undefined) ? s.jobName : 'CASE';
  const base = sanitizeFilename(raw);
  return (base || 'camlock_holes') + '.nc';
}

function computeProgram(sIn){
  const s = sIn || getSettings();
  const drillZ = (s.zOverride !== null && s.zOverride !== undefined) ? s.zOverride : s.thickness / 2;
  const safeZ = s.thickness + s.safeZ;
  let n = 100;
  const lines = [];
  const waypoints = [];
  const N = (text) => { lines.push(`N${n} ${text}`); n += 10; };

  const paramsObj = {
    jobName: s.jobName,
    jobLocation: s.jobLocation,
    qty: s.qty,
    toolOffset: s.toolOffset, bitOffset: s.bitOffset, slot2Offset: s.slot2Offset, panelWidth: s.panelWidth, panelLength: s.panelLength, thickness: s.thickness, zOverride: s.zOverride,
    holeDepth: s.holeDepth, holeDepthDowel: s.holeDepthDowel, retract: s.retract, safeZ: s.safeZ, spindle: s.spindle, feedIn: s.feedIn, feedOut: s.feedOut,
    tool: s.tool, origin: s.origin, parkY: s.parkY, vacZone1: s.vacZone1, vacZone2: s.vacZone2,
    faceCam: s.faceCam, faceDowel: s.faceDowel,
    faceHoles: faceHoles.map(h => ({ x: h.x, y: h.y, t: h.type })),
    holes: {
      FRONT: state.FRONT.map(serializeHole),
      LEFT: state.LEFT.map(serializeHole),
      BACK: state.BACK.map(serializeHole),
      RIGHT: state.RIGHT.map(serializeHole),
    }
  };
  lines.push(';CONKLIN OFFICE PRODUCT DEVELOPMENT');
  lines.push(';' + nowStamp());
  lines.push(';' + getFilename(s));
  // Broken into short chunked comment lines rather than one long line - the OSAI controller
  // rejected a single unbroken ;PARAMS line. Each chunk is its own valid comment; reconstructed
  // by joining them back together in loadFromCode().
  lines.push(';PARAMS_BEGIN');
  const paramsJson = JSON.stringify(paramsObj);
  const PARAMS_CHUNK_SIZE = 60;
  for (let i = 0; i < paramsJson.length; i += PARAMS_CHUNK_SIZE){
    lines.push(';PD ' + paramsJson.slice(i, i + PARAMS_CHUNK_SIZE));
  }
  lines.push(';PARAMS_END');

  N('G79 G0 Z0');
  N('M143');
  N('M70');
  N('M50 M150');
  N(`(UAO,${s.origin})`);
  N('G70');
  if (s.vacZone1) N('M604');
  if (s.vacZone2) N('M606');

  // Face drilling runs BEFORE edge drilling so the vacuum zones don't bleed out once the
  // panel is opened up at the edges. Dust hood stays DOWN (M49) for face work. One G81 block
  // per bit, grouped by hole type: dowel (5/16) first, then cam (3/8). Skipped entirely when
  // there are no face holes, so edge-only jobs are unaffected.
  const faceClearZ = s.thickness + 0.25;
  [
    { key: 'dowel', label: '5/16" DRILL', d: s.faceDowel },
    { key: 'cam',   label: '3/8" DRILL',  d: s.faceCam   },
  ].forEach(ft => {
    const list = faceHoles.filter(h => h.type === ft.key);
    if (!list.length) return;
    const zAbs = ft.d.depth; // depth is measured FROM THE BOTTOM face (Z0), so it IS the absolute Z target
    lines.push(`;( ${ft.label} | TOOL - ${ft.d.tool} )`);
    N(`M06 T${String(ft.d.tool).padStart(2, '0')}`);
    N(`M03 S${ft.d.rpm}`);
    N(`G00 X${fmt(list[0].x)} Y${fmt(list[0].y)}`);
    N('M49');
    N('G27');
    N(`h${ft.d.tool}`);
    N(`Z${fmt(faceClearZ)}`);
    N(`G81 Z${fmt(zAbs)} R${fmt(faceClearZ)} F${ft.d.feed}.`);
    // waypoints for the ISO view / simulator: approach high, drop to the R plane, then a
    // plunge + retract per hole (the G81 cycle's motion). plane tag 'FACE' - vertical drilling,
    // no aggregate offset applies (toPhysicalWaypoint leaves FACE waypoints unchanged).
    waypoints.push({x: list[0].x, y: list[0].y, z: s.thickness + s.safeZ, type:'rapid', plane:'FACE'});
    waypoints.push({x: list[0].x, y: list[0].y, z: faceClearZ, type:'rapid', plane:'FACE'});
    list.forEach(h => {
      N(`X${fmt(h.x)} Y${fmt(h.y)} Z${fmt(zAbs)}`);
      waypoints.push({x: h.x, y: h.y, z: faceClearZ, type:'rapid', plane:'FACE'});
      waypoints.push({x: h.x, y: h.y, z: zAbs, type:'feed', plane:'FACE'});
      waypoints.push({x: h.x, y: h.y, z: faceClearZ, type:'rapid', plane:'FACE'});
    });
    N('G80');
    N('M05');
  });

  N(`M06 T${String(s.tool).padStart(2, '0')}`);
  N(`M03 S${s.spindle}`);

  const activePlanes = PLANE_ORDER.filter(p => state[p].length > 0);
  let firstMoveDone = false;
  let curZ = safeZ;

  activePlanes.forEach((planeName, planeIdx) => {
    const plane = PLANES[planeName];
    const edgeRef = edgeRefValue(plane, s);
    const approach = edgeRef - plane.depthSign * s.totalOffset;
    const retractPt = approach - plane.depthSign * s.retract;
    const holes = toolpathOrderedHoles(planeName);

    holes.forEach((hole, i) => {
      const target = approach + plane.depthSign * holeDepthFor(hole, s); // per-hole: cam vs dowel depth
      const holeZ = holeDrillZ(hole, drillZ); // per-hole Z: own value or global
      let x, y;
      const depthCoord = retractPt;
      if (plane.edgeAxis === 'x'){ x = hole.pos; y = depthCoord; }
      else { y = hole.pos; x = depthCoord; }

      if (i === 0){
        N(`G00 X${fmt(x)} Y${fmt(y)} C${plane.angle}`);
        waypoints.push({x, y, z: curZ, type:'rapid', plane: planeName});
        if (!firstMoveDone){
          N('G27');
          N('M48'); // dust hood UP for edge drilling (down/M49 is used for face drilling only)
          N(`h${s.tool}`);
          firstMoveDone = true;
        }
        N(`Z${fmt(holeZ)}`);
        curZ = holeZ;
        waypoints.push({x, y, z: curZ, type:'rapid', plane: planeName});
      } else {
        N(`G00 X${fmt(x)} Y${fmt(y)}`);
        waypoints.push({x, y, z: curZ, type:'rapid', plane: planeName});
        // only re-issue Z when this hole's depth differs from where Z currently sits
        if (Math.abs(holeZ - curZ) > 1e-6){
          N(`Z${fmt(holeZ)}`);
          curZ = holeZ;
          waypoints.push({x, y, z: curZ, type:'rapid', plane: planeName});
        }
      }

      const AXIS = plane.depthAxis.toUpperCase();
      let fx = x, fy = y;
      if (plane.depthAxis === 'x') fx = target; else fy = target;
      N(`G01 ${AXIS}${fmt(target)} F${s.feedIn}`);
      waypoints.push({x: fx, y: fy, z: curZ, type:'feed', plane: planeName});

      let rx = x, ry = y;
      if (plane.depthAxis === 'x') rx = retractPt; else ry = retractPt;
      N(`${AXIS}${fmt(retractPt)} F${s.feedOut}`);
      waypoints.push({x: rx, y: ry, z: curZ, type:'feed', plane: planeName});
    });

    if (planeIdx < activePlanes.length - 1){
      N(`G00 Z${fmt(safeZ)}`);
      const last = waypoints[waypoints.length-1];
      curZ = safeZ;
      waypoints.push({x: last.x, y: last.y, z: curZ, type:'rapid', plane: planeName});
    }
  });

  N('M05');

  N('G79 G0 Z0');
  N(`G79 G0 Y${s.parkY} C0`);
  N('M71');
  N('M51 M151');
  N('M48');
  N('M02');
  lines.push(''); // trailing blank line - OSAI expects the file to end with one

  return { code: lines.join('\n'), waypoints };
}


function toPhysicalWaypoint(wp, s){
  const plane = PLANES[wp.plane];
  if (!plane) return wp;
  const correction = plane.depthSign * s.totalOffset;
  if (plane.depthAxis === 'x') return { ...wp, x: wp.x + correction };
  return { ...wp, y: wp.y + correction };
}

function planeDepthRefs(planeName, s){
  const plane = PLANES[planeName];
  const edgeRef = edgeRefValue(plane, s);
  return {
    entry: edgeRef,
    target: edgeRef + plane.depthSign * s.holeDepth,
    retractPt: edgeRef - plane.depthSign * s.retract,
    depthAxis: plane.depthAxis,
    depthSign: plane.depthSign,
  };
}

function drawLegend(doc, refX, y, align){
  const items = [['FRONT',[244,166,35]],['LEFT',[61,220,132]],['BACK',[90,169,230]],['RIGHT',[185,140,240]]];
  const dotGap = 7;   // space between a colored dot and its label
  const itemGap = 22; // space between one item's label and the next item's dot
  const prefixText = 'DRILLING ORDER:';
  const prefixGap = 10; // space between the prefix and the first dot

  doc.setFontSize(8.5);
  doc.setFont('helvetica','normal');
  const itemWidths = items.map(([name]) => doc.getTextWidth(name));
  doc.setFont('helvetica','bold');
  const prefixW = doc.getTextWidth(prefixText);

  let totalW = prefixW + prefixGap;
  itemWidths.forEach((w, i) => { totalW += dotGap + w + (i < items.length-1 ? itemGap : 0); });

  let cx = align === 'center' ? refX - totalW/2 : refX - totalW;
  doc.setTextColor(90,90,90);
  doc.text(prefixText, cx, y);
  cx += prefixW + prefixGap;

  doc.setFont('helvetica','normal');
  items.forEach(([name, c], i) => {
    doc.setFillColor(c[0],c[1],c[2]);
    doc.circle(cx, y-3, 3, 'F');
    doc.setTextColor(90,90,90);
    doc.text(name, cx+dotGap, y);
    cx += dotGap + itemWidths[i] + (i < items.length-1 ? itemGap : 0);
  });
}

  function dashedLine(x1, y1, x2, y2, dashLen, gapLen){
    const dx = x2-x1, dy = y2-y1, dist = Math.hypot(dx, dy);
    if (dist < 0.01) return;
    const ux = dx/dist, uy = dy/dist;
    let d = 0;
    while (d < dist){
      const segEnd = Math.min(d + dashLen, dist);
      doc.line(x1+ux*d, y1+uy*d, x1+ux*segEnd, y1+uy*segEnd);
      d += dashLen + gapLen;
    }
  }

  // The actual toolpath - same waypoint data used to generate the g-code and the on-screen
  // schematic - so this can never drift out of sync with what the machine will actually do.
  // Drawn first (rapid dashed, then colored depth/retract) so hole markers sit on top of it.
  const waypoints = computeProgram(s).waypoints.map(wp => toPhysicalWaypoint(wp, s));
  doc.setDrawColor(160,160,160); doc.setLineWidth(0.6);
  for (let i = 1; i < waypoints.length; i++){
    const prev = waypoints[i-1], curr = waypoints[i];
    if (curr.type === 'rapid'){
      dashedLine(toPdfX(prev.x), toPdfY(prev.y), toPdfX(curr.x), toPdfY(curr.y), 3, 2);
    }
  }
  for (let i = 1; i < waypoints.length; i++){
    const prev = waypoints[i-1], curr = waypoints[i];
    if (curr.type !== 'rapid'){
      if (curr.plane === 'FACE') continue; // vertical plunge - no edge geometry; drawn as markers below
      const c = planeColorRGB[curr.plane] || [200,200,200];
      const refs = planeDepthRefs(curr.plane, s);
      const da = refs.depthAxis;
      const edgeAxisVal = da === 'x' ? prev.y : prev.x; // constant across a single hole's feed move
      const entryPt = da === 'x' ? {x: refs.entry, y: edgeAxisVal} : {x: edgeAxisVal, y: refs.entry};
      doc.setDrawColor(c[0],c[1],c[2]); doc.setLineWidth(1.4);
      doc.line(toPdfX(prev.x), toPdfY(prev.y), toPdfX(entryPt.x), toPdfY(entryPt.y));
      doc.line(toPdfX(entryPt.x), toPdfY(entryPt.y), toPdfX(curr.x), toPdfY(curr.y));
    }
  }

  function rectX_or_rectXplus(planeName){ return planeName === 'LEFT' ? rectX : rectX + rectW; }
  function rectY_or_rectYplus(planeName){ return planeName === 'FRONT' ? rectY + rectH : rectY; }
  doc.setLineWidth(1);

  // Labels are measured with doc.getTextWidth (actual font metrics) rather than guessed, so the
  // stagger decision is based on real overlap, not an arbitrary fixed gap that doesn't scale with
  // how long "F1: 2.000"" style labels actually are.
  function drawEdge(planeName, tickFn, labelFn, isVerticalEdge){
    const holes = toolpathOrderedHoles(planeName);
    if (holes.length === 0) return;
    const pts = holes.map((h,i) => ({ pos: h.pos, idx: i })); // idx = toolpath order, matches Fn labels elsewhere
    const sortKey = isVerticalEdge ? (p => L - p.pos) : (p => p.pos); // re-sort by physical position for tick/stagger placement only
    pts.sort((a,b) => sortKey(a) - sortKey(b));
    const coordFor = (p) => {
      const raw = isVerticalEdge ? (rectY + rectH - p.pos*scale) : (rectX + p.pos*scale);
      const lo = isVerticalEdge ? y0 + 2 : x0 + 2;
      const hi = isVerticalEdge ? y0 + maxH - 2 : x0 + maxW - 2;
      return Math.min(hi, Math.max(lo, raw));
    };
    const c = planeColorRGB[planeName];
    doc.setFontSize(8);
    let prevCoord = null, prevHalfWidth = 0, stagger = 0;
    pts.forEach(p => {
      const coord = coordFor(p);
      const txt = `${planeName[0]}${p.idx+1}: ${fmt(p.pos)}"`;
      const labelWidth = doc.getTextWidth(txt);
      const gapNeeded = isVerticalEdge ? 13 : (labelWidth/2 + prevHalfWidth + 4);
      if (prevCoord !== null && Math.abs(coord - prevCoord) < gapNeeded){
        stagger = stagger === 0 ? 1 : 0;
      } else {
        stagger = 0;
      }
      doc.setDrawColor(c[0],c[1],c[2]);
      doc.setFillColor(c[0],c[1],c[2]);
      tickFn(coord);
      doc.circle(...(isVerticalEdge ? [rectX_or_rectXplus(planeName), coord] : [coord, rectY_or_rectYplus(planeName)]), 2.4, 'F');
      doc.setTextColor(c[0],c[1],c[2]); doc.setFontSize(8);
      labelFn(coord, stagger, txt);
      prevCoord = coord;
      prevHalfWidth = labelWidth/2;
    });
  }

  // FRONT: bottom edge (Y=0), ticks/labels below
  drawEdge('FRONT',
    (coord) => { doc.line(coord, rectY+rectH, coord, rectY+rectH+6); },
    (coord, stagger, txt) => { doc.text(txt, coord, rectY+rectH+16+stagger*11, { align: 'center' }); },
    false);
  // BACK: top edge (Y=length), ticks/labels above
  drawEdge('BACK',
    (coord) => { doc.line(coord, rectY, coord, rectY-6); },
    (coord, stagger, txt) => { doc.text(txt, coord, rectY-9-stagger*11, { align: 'center' }); },
    false);
  // LEFT: left edge (X=0), ticks/labels to the left
  drawEdge('LEFT',
    (coord) => { doc.line(rectX, coord, rectX-6, coord); },
    (coord, stagger, txt) => { doc.text(txt, rectX-9-stagger*44, coord+3, { align: 'right' }); },
    true);
  // RIGHT: right edge (X=width), ticks/labels to the right
  drawEdge('RIGHT',
    (coord) => { doc.line(rectX+rectW, coord, rectX+rectW+6, coord); },
    (coord, stagger, txt) => { doc.text(txt, rectX+rectW+9+stagger*44, coord+3, { align: 'left' }); },
    true);

  // face-drilled holes on the panel face. Shape carries the type so B&W prints stay readable
  // (cam = hollow circle, dowel = filled); color stays on top for screens / color printers.
  faceHoles.forEach(h => {
    const px = toPdfX(h.x), py = toPdfY(h.y);
    if (h.type === 'dowel'){
      doc.setFillColor(78,161,255);
      doc.circle(px, py, 3, 'F');
    } else {
      doc.setDrawColor(244,166,35); doc.setLineWidth(1.2);
      doc.circle(px, py, 3.4, 'S');
    }
  });

  return rectY + rectH + 46; // bottom edge of the labels, for layout purposes below
}

function drawLegend(doc, refX, y, align){
  const items = [['FRONT',[244,166,35]],['LEFT',[61,220,132]],['BACK',[90,169,230]],['RIGHT',[185,140,240]]];
  const dotGap = 7;   // space between a colored dot and its label
  const itemGap = 22; // space between one item's label and the next item's dot
  const prefixText = 'DRILLING ORDER:';
  const prefixGap = 10; // space between the prefix and the first dot

  doc.setFontSize(8.5);
  doc.setFont('helvetica','normal');
  const itemWidths = items.map(([name]) => doc.getTextWidth(name));
  doc.setFont('helvetica','bold');
  const prefixW = doc.getTextWidth(prefixText);

  let totalW = prefixW + prefixGap;
  itemWidths.forEach((w, i) => { totalW += dotGap + w + (i < items.length-1 ? itemGap : 0); });

  let cx = align === 'center' ? refX - totalW/2 : refX - totalW;
  doc.setTextColor(90,90,90);
  doc.text(prefixText, cx, y);
  cx += prefixW + prefixGap;

  doc.setFont('helvetica','normal');
  items.forEach(([name, c], i) => {
    doc.setFillColor(c[0],c[1],c[2]);
    doc.circle(cx, y-3, 3, 'F');
    doc.setTextColor(90,90,90);
    doc.text(name, cx+dotGap, y);
    cx += dotGap + itemWidths[i] + (i < items.length-1 ? itemGap : 0);
  });
}


function cnc1CutSheet(sIn, doc) {
  const s = sIn;
  if (s.totalOffset == null) s.totalOffset = (s.toolOffset || 0) + (s.bitOffset || 0);
  cnc1Program(s);                                                    // sets the module state the drawing reads
    const pageW = 612, pageH = 792, margin = 40;
    let y = margin;

    const hr = (yPos) => { doc.setDrawColor(210); doc.setLineWidth(0.75); doc.line(margin, yPos, pageW - margin, yPos); };
    const label = (text, x, yy, size, bold, color) => {
      doc.setFont('helvetica', bold ? 'bold' : 'normal');
      doc.setFontSize(size);
      const c = color || [30,30,30];
      doc.setTextColor(c[0], c[1], c[2]);
      doc.text(text, x, yy);
    };
    const footer = (pageNum, totalPages) => {
      doc.setPage(pageNum);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,150);
      doc.text(`Page ${pageNum} of ${totalPages}`, pageW/2, pageH - 20, { align: 'center' });
    };

    // header - title/info on the left, logo on the right
    label('DRILLING CUT SHEET', margin, y + 8, 16, true);
    label('Generated ' + nowStamp(), margin, y + 24, 9, false, [120,120,120]);
    doc.text('OSAI 10 Series  \u00b7  Hendrick HSR', margin, y + 37);

    try { doc.addImage(null, 'PNG', pageW - margin - 110, y - 4, 110, 25.8); } catch(e){}
    y += 45; hr(y); y += 22;

    // job name
    label('JOB: ' + (s.jobName ? s.jobName : '(untitled)') + '      QTY: ' + fmt(s.qty), margin, y, 14, true);
    y += 22;

    // two-column block: setup values the operator acts on, plus the orientation callout
    const colGap = 20, colW = (pageW - 2*margin - colGap)/2, col1X = margin, col2X = margin + colW + colGap;
    const yTop = y;
    label('SETUP', col1X, y, 10, true); y += 15;
    [
      `Tool #: ${s.tool}`,
      `Panel: ${fmt(s.panelWidth)}" W  \u00d7  ${fmt(s.panelLength)}" L  \u00d7  ${fmt(s.thickness)}" thick`,
      `Hole depth cam: ${fmt(s.holeDepth)}"      dowel: ${fmt(s.holeDepthDowel)}"`,
      `Drill Z: ${fmt((s.zOverride !== null && s.zOverride !== undefined) ? s.zOverride : s.thickness/2)}"`,
    ].forEach(l => { label(l, col1X, y, 9.5, false); y += 14; });

    let y2 = yTop;

    y = Math.max(y, y2) + 12; hr(y); y += 20;

    // hole positions table
    const totalHoles = PLANE_ORDER.reduce((sum,p) => sum + state[p].length, 0);
    label(`HOLE POSITIONS  \u2014  ${totalHoles} total`, margin, y, 11, true); y += 18;
    const holeColW = (pageW - 2*margin)/4;
    const holeRowStartY = y;
    let maxHoleRows = 0;
    PLANE_ORDER.forEach((plane, i) => {
      const cx = margin + i*holeColW;
      const orderedHoles = toolpathOrderedHoles(plane);
      label(`${plane}  (C${PLANES[plane].angle})`, cx+6, holeRowStartY, 10, true);
      doc.setTextColor(90,90,90); doc.setFont('helvetica','normal'); doc.setFontSize(9);
      if (orderedHoles.length === 0){
        doc.text('(no holes)', cx+6, holeRowStartY + 15);
      } else {
        orderedHoles.forEach((hole, idx) => {
          const typeTag = hole.type === 'dowel' ? '  (D)' : '';
          const zTag = (hole.z != null) ? `  Z${fmt(hole.z)}` : '';
          doc.text(`${plane[0]}${idx+1}:  ${fmt(hole.pos)}"${typeTag}${zTag}`, cx+6, holeRowStartY + 15 + idx*13);
        });
      }
      maxHoleRows = Math.max(maxHoleRows, orderedHoles.length);
    });
    const holeTableBottom = holeRowStartY - 10 + Math.max(1, maxHoleRows + 1) * 13 + 10;
    PLANE_ORDER.forEach((plane, i) => {
      const cx = margin + i*holeColW;
      doc.setDrawColor(220); doc.line(cx, holeRowStartY-12, cx, holeTableBottom);
    });
    doc.line(pageW-margin, holeRowStartY-12, pageW-margin, holeTableBottom);
    y = holeTableBottom + 14;
    hr(y); y += 20;

    // face drilling table - only when the job actually has face holes
    if (faceHoles.length){
      label(`FACE DRILLING  \u2014  ${faceHoles.length} total`, margin, y, 11, true); y += 18;
      const faceGroups = [
        { key: 'dowel', title: `DOWEL PIN 5/16"  (T${String(s.faceDowel.tool).padStart(2,'0')})`, tag: 'D' },
        { key: 'cam',   title: `CAM SCREW 3/8"  (T${String(s.faceCam.tool).padStart(2,'0')})`,   tag: 'C' },
      ];
      const faceColW = (pageW - 2*margin)/2;
      const faceStartY = y;
      let maxFaceRows = 0;
      faceGroups.forEach((g, i) => {
        const cx = margin + i*faceColW;
        const list = faceHoles.filter(h => h.type === g.key);
        label(g.title, cx+6, faceStartY, 10, true);
        doc.setTextColor(90,90,90); doc.setFont('helvetica','normal'); doc.setFontSize(9);
        if (!list.length){
          doc.text('(none)', cx+6, faceStartY + 15);
        } else {
          list.forEach((h, idx) => {
            doc.text(`${g.tag}${idx+1}:  X ${fmt(h.x)}"   Y ${fmt(h.y)}"`, cx+6, faceStartY + 15 + idx*13);
          });
        }
        maxFaceRows = Math.max(maxFaceRows, list.length);
      });
      const faceBottom = faceStartY - 10 + Math.max(1, maxFaceRows + 1)*13 + 10;
      faceGroups.forEach((g, i) => {
        const cx = margin + i*faceColW;
        doc.setDrawColor(220); doc.line(cx, faceStartY-12, cx, faceBottom);
      });
      doc.line(pageW-margin, faceStartY-12, pageW-margin, faceBottom);
      y = faceBottom + 14;
      hr(y); y += 20;
    }

    // operator checklist
    label('OPERATOR CHECKLIST', margin, y, 11, true); y += 18;
    const checks = [
      `Correct tool (#${s.tool}) loaded and verified`,
      'Panel dimensions confirmed with cut sheet and panel orientation is correct on machine',
      'First hole inspected before running the full program',
    ];
    doc.setTextColor(30,30,30);
    checks.forEach(c => {
      doc.setDrawColor(120); doc.setLineWidth(0.75);
      doc.rect(margin, y-8, 9, 9);
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      doc.text(c, margin+16, y);
      y += 18;
    });
    y += 10;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(30,30,30);
    doc.text('Operator: ______________________________          Date: ______________', margin, y);
    y += 16;
    doc.text('Notes:', margin, y);
    doc.setDrawColor(220);
    for (let i=0; i<2; i++){ y += 15; doc.line(margin, y, pageW-margin, y); }

    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,150);
    doc.text(getFilename(s), margin, pageH - 20);
    doc.text('Page 1 of 2', pageW/2, pageH - 20, { align: 'center' });

    // page 2: panel diagram, native vector drawing from data, given the full page for accuracy
    doc.addPage();
    y = margin;
    // same header as page 1
    label('DRILLING CUT SHEET', margin, y + 8, 16, true);
    label('Generated ' + nowStamp(), margin, y + 24, 9, false, [120,120,120]);
    doc.text('OSAI 10 Series  \u00b7  Hendrick HSR', margin, y + 37);
    try { doc.addImage(null, 'PNG', pageW - margin - 110, y - 4, 110, 25.8); } catch(e){}
    y += 45; hr(y); y += 22;
    label('JOB: ' + (s.jobName ? s.jobName : '(untitled)') + '      QTY: ' + fmt(s.qty), margin, y, 14, true);
    y += 20;
    label(`PANEL LAYOUT`, margin, y, 12, true);
    y += 12;
    const diagramTop = y;
    const legendY = pageH - margin - 8;
    const captionY = legendY - 13;
    const diagramMaxH = captionY + 4 - diagramTop;
    drawPanelDiagram(doc, s, margin, diagramTop, pageW - 2*margin, diagramMaxH);
    // legend sits inside the diagram's own reserved top padding (mostly empty space above the
    // panel rectangle) rather than a separate row - reads as part of the layout view, not the
    // page header, and is always clear of BACK-plane tick labels regardless of panel proportions.
    drawLegend(doc, pageW/2, diagramTop + 24, 'center');
    if (faceHoles.length){
      // face holes use their own colors on the diagram - give them a key so the circles read clearly
      doc.setFontSize(8.5); doc.setFont('helvetica','normal');
      const fItems = [['DOWEL PIN 5/16"',[78,161,255]], ['CAM SCREW 3/8"',[244,166,35]]];
      const fPrefix = 'FACE HOLES:';
      doc.setFont('helvetica','bold');
      const fPrefixW = doc.getTextWidth(fPrefix);
      doc.setFont('helvetica','normal');
      const fWidths = fItems.map(([n]) => doc.getTextWidth(n));
      let fTotal = fPrefixW + 10;
      fWidths.forEach((w, i) => { fTotal += 7 + w + (i < fItems.length-1 ? 22 : 0); });
      let fx = pageW/2 - fTotal/2;
      const fy = diagramTop + 38;
      doc.setFont('helvetica','bold'); doc.setTextColor(90,90,90);
      doc.text(fPrefix, fx, fy);
      fx += fPrefixW + 10;
      doc.setFont('helvetica','normal');
      fItems.forEach(([n, c], i) => {
        if (n.startsWith('DOWEL')){
          doc.setFillColor(c[0],c[1],c[2]);
          doc.circle(fx, fy-3, 2.7, 'F');
        } else {
          doc.setDrawColor(c[0],c[1],c[2]); doc.setLineWidth(1.2);
          doc.circle(fx, fy-3, 3, 'S');
        }
        doc.setTextColor(90,90,90);
        doc.text(n, fx+7, fy);
        fx += 7 + fWidths[i] + (i < fItems.length-1 ? 22 : 0);
      });
    }
    doc.setFontSize(7.5); doc.setTextColor(150,150,150); doc.setFont('helvetica','normal');
    doc.text('Position = distance from the 0,0 corner.', margin, captionY);

    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,150);
    doc.text(getFilename(s), margin, pageH - 20);
    doc.text('Page 2 of 2', pageW/2, pageH - 20, { align: 'center' });


  return doc;
}


function PDFDoc(){
  const PW=612,PH=792; const pages=[]; const images=[]; let cur=null;
  const esc=t=>String(t).replace(/[\\()]/g,m=>'\\'+m).replace(/[^\x20-\x7e]/g,c=>({'—':'-','·':'-','×':'x','¼':'1/4','“':'"','”':'"','’':"'"}[c]||'?'));
  const Y=y=>PH-y;
  const api={
    PW,PH,
    page(){ cur={ops:[]}; pages.push(cur); return api; },
    goPage(i){ if(pages[i]) cur=pages[i]; return api; },
    font(size,bold){ cur.ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ET`); return api; },
    col(g,st){ return Array.isArray(g)?g.map(v=>(v/255).toFixed(3)).join(' ')+(st?' RG':' rg'):`${g}${st?' G':' g'}`; },
    text(x,y,str,size=10,bold=false,align='left',gray=0){ const w=api.width(str,size,bold); const xx=align==='center'?x-w/2:align==='right'?x-w:x; cur.ops.push(`BT ${api.col(gray)} /${bold?'F2':'F1'} ${size} Tf ${xx.toFixed(2)} ${Y(y).toFixed(2)} Td (${esc(str)}) Tj ET 0 g`); return api; },
    width(str,size,bold){ const wA=bold?HB:HN; let w=0; for(const ch of String(str)){ const c=ch.charCodeAt(0); w+=(wA[c]||556); } return w*size/1000; },
    line(x1,y1,x2,y2,lw=0.8,dash,color=0){ cur.ops.push(`${api.col(color,1)} ${lw} w ${dash?`[${dash}] 0 d`:'[] 0 d'} ${x1.toFixed(2)} ${Y(y1).toFixed(2)} m ${x2.toFixed(2)} ${Y(y2).toFixed(2)} l S [] 0 d`); return api; },
    rect(x,y,w,h,{lw=0.8,fill=null,stroke=true,sc=0}={}){ cur.ops.push(`${api.col(sc,1)} ${lw} w ${fill!==null?`${api.col(fill)} `:''} ${x.toFixed(2)} ${Y(y+h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill!==null&&stroke?'B':fill!==null?'f':'S'} 0 g`); return api; },
    circle(cx,cy,r,{lw=0.8,fill=null,stroke=true,sc=0}={}){ const k=0.5523*r, y=Y(cy); cur.ops.push(`${api.col(sc,1)} ${lw} w ${fill!==null?`${api.col(fill)} `:''} ${(cx+r).toFixed(2)} ${y.toFixed(2)} m ${(cx+r).toFixed(2)} ${(y+k).toFixed(2)} ${(cx+k).toFixed(2)} ${(y+r).toFixed(2)} ${cx.toFixed(2)} ${(y+r).toFixed(2)} c ${(cx-k).toFixed(2)} ${(y+r).toFixed(2)} ${(cx-r).toFixed(2)} ${(y+k).toFixed(2)} ${(cx-r).toFixed(2)} ${y.toFixed(2)} c ${(cx-r).toFixed(2)} ${(y-k).toFixed(2)} ${(cx-k).toFixed(2)} ${(y-r).toFixed(2)} ${cx.toFixed(2)} ${(y-r).toFixed(2)} c ${(cx+k).toFixed(2)} ${(y-r).toFixed(2)} ${(cx+r).toFixed(2)} ${(y-k).toFixed(2)} ${(cx+r).toFixed(2)} ${y.toFixed(2)} c ${fill!==null&&stroke?'B':fill!==null?'f':'S'} 0 g`); return api; },
    poly(pts,{lw=0.8,fill=null,stroke=true,sc=0}={}){ cur.ops.push(`${api.col(sc,1)} ${lw} w ${fill!==null?`${api.col(fill)} `:''} `+pts.map((p,i)=>`${p[0].toFixed(2)} ${Y(p[1]).toFixed(2)} ${i?'l':'m'}`).join(' ')+` h ${fill!==null&&stroke?'B':fill!==null?'f':'S'} 0 g`); return api; },
    image(canvas,x,y,w,h){ const data=canvas.toDataURL('image/jpeg',0.92).split(',')[1]; const bin=atob(data); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); const idx=images.length; images.push({bytes,w:canvas.width,h:canvas.height}); cur.ops.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${Y(y+h).toFixed(2)} cm /Im${idx} Do Q`); return api; },
    build(){
      const enc=new TextEncoder(); const chunks=[]; let len=0; const offs=[]; const push=(d)=>{ const b=typeof d==='string'?enc.encode(d):d; chunks.push(b); len+=b.length; };
      push('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n');
      const n=pages.length, imgBase=5+n*2; const objs=[];
      const obj=(i,body)=>{ offs[i]=len; push(`${i} 0 obj\n`); if(typeof body==='string') push(body); else body.forEach(push); push('\nendobj\n'); };
      obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
      obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${5+i*2} 0 R`).join(' ')}] /Count ${n} >>`);
      obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
      obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const xo=images.map((_,i)=>`/Im${i} ${imgBase+i} 0 R`).join(' ');
      pages.forEach((p,i)=>{ const content=p.ops.join('\n'); const cb=enc.encode(content);
        obj(5+i*2,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << ${xo} >> >> /Contents ${6+i*2} 0 R >>`);

async function exportCutSheet(p) {

/* NE isometric toolpath: the same waypoints the g-code is written from */
const TP_COLOR = { FRONT: '#f4a623', LEFT: '#3ddc84', BACK: '#5aa9e6', RIGHT: '#b98cf0' };
function toolpathScene(P) {
  const r = cnc1Program(P), wps = r.waypoints.map(wp => toPhysicalWaypoint(wp, P));
  const W = P.panelWidth, L = P.panelLength, TH = P.thickness;
  const c30 = Math.cos(Math.PI / 6), s30 = Math.sin(Math.PI / 6);
  const pr = (x, y, z) => [(x - y) * c30, (x + y) * s30 - z * 1.15];
  const pts = wps.map(w => ({ ...w, p: pr(w.x, w.y, w.z) }));
  const corners = [[0, 0], [W, 0], [W, L], [0, L]];
  const topC = corners.map(([x, y]) => pr(x, y, TH)), botC = corners.map(([x, y]) => pr(x, y, 0));
  const xs = [...pts.map(q => q.p[0]), ...topC.map(q => q[0]), ...botC.map(q => q[0])];
  const ys = [...pts.map(q => q.p[1]), ...topC.map(q => q[1]), ...botC.map(q => q[1])];
  return { pts, topC, botC, box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] };
}
function toolpathSVG(P, wpx, hpx) {
  const S = toolpathScene(P), [x0, y0, x1, y1] = S.box, pad = 30;
  const sc = Math.min((wpx - 2 * pad) / (x1 - x0), (hpx - 2 * pad) / (y1 - y0));
  const X = q => pad + (q[0] - x0) * sc, Y = q => hpx - pad - (q[1] - y0) * sc;
  const O = [];
  const face = (c, fill) => O.push('<polygon points="' + c.map(q => X(q) + ',' + Y(q)).join(' ') + '" fill="' + fill + '" stroke="#39414f" stroke-width="1"/>');
  face(S.botC, 'rgba(255,255,255,.02)');
  for (let i = 0; i < 4; i++) { const j = (i + 1) % 4;
    O.push('<polygon points="' + [S.botC[i], S.botC[j], S.topC[j], S.topC[i]].map(q => X(q) + ',' + Y(q)).join(' ') + '" fill="rgba(255,255,255,.03)" stroke="#39414f" stroke-width="1"/>'); }
  face(S.topC, 'rgba(255,255,255,.05)');
  let path = '';
  for (let i = 1; i < S.pts.length; i++) { const a = S.pts[i - 1], b = S.pts[i];
    const ink = b.type === 'rapid' ? '#5c6675' : (TP_COLOR[b.plane] || '#e7ecf5');
    path += '<line x1="' + X(a.p) + '" y1="' + Y(a.p) + '" x2="' + X(b.p) + '" y2="' + Y(b.p) + '" stroke="' + ink + '" stroke-width="' + (b.type === 'rapid' ? 1 : 1.8) + '"' + (b.type === 'rapid' ? ' stroke-dasharray="4 3"' : '') + '/>'; }
  O.push(path);
  O.push('<circle id="tpTool" r="4.5" fill="#f5a524" stroke="#131313" stroke-width="1.2" cx="' + X(S.pts[0].p) + '" cy="' + Y(S.pts[0].p) + '"/>');
  return { svg: '<svg id="tpSvg" viewBox="0 0 ' + wpx + ' ' + hpx + '" style="width:100%;height:100%;display:block">' + O.join('') + '</svg>',
           screen: S.pts.map(q => [X(q.p), Y(q.p), q.type]) };
}
let TP = null;
function openToolpath(p) {
  const P = cnc1Params(p); if (!P) return;
  const tp = toolpathSVG(P, 900, 620);
  let ov = $('tpOverlay');
  if (!ov) { ov = document.createElement('div'); ov.id = 'tpOverlay';
    ov.style.cssText = 'position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.86);display:flex;align-items:center;justify-content:center';
    document.body.appendChild(ov); }
  ov.innerHTML = '<div style="width:min(960px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px">' +
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">' +
    '<span style="color:var(--amber);font-weight:700;letter-spacing:.08em;font-size:12px">TOOLPATH \u00b7 ' + p.name + '</span>' +
    '<span style="color:var(--mute);font-size:9.5px">NE ISO \u00b7 dashed = rapid \u00b7 colour = plane (FRONT/LEFT/BACK/RIGHT) \u00b7 same waypoints as the .nc</span>' +
    '<span style="flex:1"></span><button class="btn on" id="tpRun">RUN</button><button class="btn" id="tpClose">CLOSE</button></div>' +
    '<div style="height:62vh;background:#0f1218;border:1px solid var(--line);border-radius:8px">' + tp.svg + '</div></div>';
  ov.style.display = 'flex';
  $('tpClose').onclick = () => { ov.style.display = 'none'; if (TP) cancelAnimationFrame(TP); TP = null; };
  ov.onclick = e => { if (e.target === ov) $('tpClose').onclick(); };
  $('tpRun').onclick = () => { if (TP) cancelAnimationFrame(TP);
    const pts = tp.screen, dot = $('tpTool'); let i = 1, t = 0;
    const step = () => { if (i >= pts.length) { TP = null; return; }
      const a = pts[i - 1], b = pts[i], v = b[2] === 'rapid' ? 0.12 : 0.035;
      t += v; if (t >= 1) { t = 0; i++; }
      const k = Math.min(t, 1), x = a[0] + (b[0] - a[0]) * k, y = a[1] + (b[1] - a[1]) * k;
      dot.setAttribute('cx', x); dot.setAttribute('cy', y); TP = requestAnimationFrame(step); };
    dot.setAttribute('cx', pts[0][0]); dot.setAttribute('cy', pts[0][1]); TP = requestAnimationFrame(step); };
}

/* ---------- ASSEMBLY: read the joints back from the drilled holes ---------- */
/* Each edge PIN/DOWEL in a butting part meets a face hole in its receiver. The receiver takes the
   cam pins and dowels standing in its face; the butting part carries the cam nuts and the drilled
   edge - so it can only go on one way. The steps below are generated from that graph.            */
function faceWord(pt, under) {
  const f = pt.frame, val = under ? f.opp : f.shown, n = Math.sign(val - (under ? f.shown : f.opp));
  if (f.ax === 2) return n < 0 ? 'UNDERSIDE' : 'TOP FACE';
  if (f.ax === 1) return n > 0 ? (pt.name === 'BACK PANEL' ? 'OUTSIDE (BACK) FACE' : 'BACK FACE') : 'FRONT FACE';
  if (pt.name === 'LEFT SIDE') return n > 0 ? 'INSIDE FACE' : 'OUTSIDE FACE';
  if (pt.name === 'RIGHT SIDE') return n < 0 ? 'INSIDE FACE' : 'OUTSIDE FACE';
  return n < 0 ? 'LEFT FACE' : 'RIGHT FACE';
}
function jointGraph(all) {
  const ps = (all || parts(M)).filter(q => q.frame && q.holes && !q.hardware);
  const faceIdx = [];
  ps.forEach(q => q.holes.filter(h => !h.edge && (h.type === 'PIN' || h.type === 'DOWEL'))
    .forEach(h => faceIdx.push({ q, h, c: faceHoleWorld(q, h) })));
  const J = {};
  ps.forEach(b => b.holes.filter(h => h.edge && (h.type === 'PIN' || h.type === 'DOWEL')).forEach(h => {
    const c = edgeHoleWorld(b, h);
    const m = faceIdx.find(x => x.q !== b && x.h.type === h.type &&
      Math.hypot(x.c[0] - c[0], x.c[1] - c[1], x.c[2] - c[2]) < 0.03);
    if (!m) return;
    const camsOnOpp = b.holes.some(k => k.type === 'CAM' && k.under);
    const key = b.name + '\u2192' + m.q.name;
    const j = J[key] = J[key] || { b, r: m.q, pins: 0, dow: 0, rFace: faceWord(m.q, m.h.under), bNut: faceWord(b, camsOnOpp) };
    j[h.type === 'PIN' ? 'pins' : 'dow']++;
  }));
  return Object.values(J);
}
function asmPlan(all) {
  all = all || parts(M);
  const G = jointGraph(all), ps = all.filter(q => !q.hardware);
  const by = n => ps.find(q => q.name === n), has = n => ps.some(q => q.name.startsWith(n));
  const R = by('RIGHT SIDE'), L = by('LEFT SIDE'), TOP = by('TOP'), BK = by('BACK PANEL');
  const recv = r => G.filter(j => j.r === r), buttsOf = b => G.filter(j => j.b === b);
  const cnt = list => { const pins = list.reduce((a, j) => a + j.pins, 0), dow = list.reduce((a, j) => a + j.dow, 0);
    return [pins ? pins + ' cam pin' + (pins > 1 ? 's' : '') + ' (A)' : '', dow ? dow + ' dowel' + (dow > 1 ? 's' : '') + ' (C)' : ''].filter(Boolean).join(' and '); };
  const steps = [], sub = j => j.b.name + ' \u2192 ' + j.r.name + ': ' + cnt([j]) + ', nuts turning from its ' + j.bNut;
  /* 1 - right side prep + everything that lands on it */
  if (R) { const rj = recv(R);
    const landing = [...new Set(rj.map(j => j.b))].filter(b => !b.name.startsWith('BACK'));
    steps.push({ text: 'Lay the RIGHT SIDE flat, ' + (rj[0] ? rj[0].rFace : 'INSIDE FACE').toLowerCase() + ' up. Screw ' + cnt(rj) +
      ' into its face holes. Press the cam nuts (B) into every part that lists them below - the arrow on each nut points at its pin hole.',
      subs: landing.map(b => b.name + ' - ' + b.holes.filter(h => h.type === 'CAM').length + ' cam nuts into its ' + faceWord(b, b.holes.some(k => k.type === 'CAM' && k.under)) ) });
    landing.forEach(b => steps.push({ text: 'Stand the ' + b.name + ' onto the pins in the right side. It only fits one way: the drilled edge over the pins and dowels, cam nuts facing its ' +
      (buttsOf(b).find(j => j.r === R) || { bNut: '?' }).bNut.toLowerCase() + ' so you can reach them. Quarter-turn each cam clockwise to lock.',
      subs: buttsOf(b).filter(j => j.r === R).map(sub) })); }
  /* 2 - dividers push down onto what carries them */
  const divs = ps.filter(q => q.name.startsWith('DIVIDER'));
  divs.forEach(d => { const js = buttsOf(d).filter(j => !j.r.name.startsWith('BACK') && j.r.name !== 'TOP');   // the back and top come later; their pins meet this divider then
    if (js.length) steps.push({ text: 'Screw ' + cnt(js) + ' into the ' + [...new Set(js.map(j => j.r.name + ' (' + j.rFace.toLowerCase() + ')'))].join(' and ') +
      '. Push the ' + d.name + ' down onto them - drilled edge first, cam nuts reachable from its ' + js[0].bNut.toLowerCase() + '. Lock the cams. Its other edges meet their pins when the back and top go on.', subs: js.map(sub) }); });
  /* 3 - left side closes the carcass */
  if (L) { const lj = recv(L);
    steps.push({ text: 'Screw ' + cnt(lj) + ' into the LEFT SIDE ' + (lj[0] ? lj[0].rFace : 'INSIDE FACE').toLowerCase() +
      ', then press it down onto the standing edges. Every pin must find its edge hole - if the side sits proud anywhere, a dowel missed. Lock all its cams.', subs: lj.map(sub) }); }
  /* 4 - back: it receives some parts and butts into others */
  if (BK) { const asRecv = recv(BK), asButt = buttsOf(BK);

      hwModels(c2).push({ name: nm.toUpperCase(), mcm: $('optBody').querySelector('[data-hwnum="' + c2 + '"]').value.trim() }); drawOpts(); });
    return; }
  const J2 = M.opt.joinery || (M.opt.joinery = structuredClone(JOINERY));
  $('optBody').style.display = '';
  const grp = optTab === 'DRAWERS' ? M.opt.drawer : optTab === 'SHELVES' ? M.opt.shelf : optTab === 'JOINERY' ? J2 : optTab === 'GLIDES' ? (J2.glide || (J2.glide = structuredClone(JOINERY.glide))) : M.opt.door;
  $('optBody').innerHTML = OPT[optTab].map(([k, l, ty, os]) => ty === 'sel'
    ? '<div class="sec"><h3>' + l + '</h3><select data-k="' + k + '">' + os.map(o => '<option value="' + o[0] + '"' + (grp[k] === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>'
    : '<div class="sec"><h3>' + l + '</h3><input data-k="' + k + '" type="number" step="0.0001" value="' + (grp[k] == null ? '' : r3(grp[k])) + '"' + (grp[k] == null ? ' placeholder="auto"' : '') + '><div class="mm">' + (grp[k] == null ? '' : '= ' + (grp[k] * MM).toFixed(1) + ' mm') + '</div></div>').join('');
  $('optBody').querySelectorAll('input,select').forEach(i => i.onchange = () => { grp[i.dataset.k] = i.tagName === 'SELECT' ? i.value : (i.value === '' ? null : parseFloat(i.value)); drawOpts(); render(); });
}
$('optBtn').onclick = () => { drawOpts(); $('optModal').hidden = false; };
$('optClose').onclick = () => { $('optModal').hidden = true; };
$('optModal').addEventListener('click', e => { if (e.target === $('optModal')) $('optModal').hidden = true; });

/* ---------- PRESETS / NEW / SAVE / LOAD ---------- */
Object.entries(PRESETS).forEach(([k, p]) => { const o = document.createElement('option'); o.value = k; o.textContent = k + ' · ' + p.label; $('preset').appendChild(o); });
$('preset').onchange = () => { if (!$('preset').value) return; M = loadPreset($('preset').value); HIST.past = []; HIST.future = []; HIST.last = null; UI.sc = null; UI.sel = { kind: 'case' }; $('job').value = M.job; render(); };
$('undoBtn').onclick = undo; $('redoBtn').onclick = redo;
$('newBtn').onclick = () => { M = newCase(); HIST.past = []; HIST.future = []; HIST.last = null; UI.sc = null; UI.sel = { kind: 'case' }; $('preset').value = ''; $('job').value = M.job; render(); };
$('job').onchange = () => { M.job = $('job').value; };
$('saveBtn').onclick = () => {
  const doc = { format: 'CASEMAKER2', version: 1, build: '2026-09-03.45', saved: new Date().toISOString(), model: M };
  download((M.job || 'CASE').replace(/\s+/g, '_') + '_' + '2026-09-03.45'.slice(0, 10) + '.casemaker2', JSON.stringify(doc), 'application/json'); };
$('loadBtn').onclick = () => $('loadFile').click();
$('loadFile').onchange = e => { const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { try { const d = JSON.parse(t); if (d.format !== 'CASEMAKER2') throw new Error('not a CASEMAKER 2 file');
      M = d.model; UI.sel = { kind: 'case' }; UI.sc = null; $('job').value = M.job || 'NEW CASE'; render(); }
    catch (err) { alert('Could not load: ' + err.message); } }); e.target.value = ''; };

/* ---------- NEW-BUILD DETECTION ----------
   Served over http: the page re-reads itself every minute and compares build stamps.
   Opened from a file: the browser blocks reading files, so tabs tell each other instead -
   opening a newer build in any tab tells every older tab on this machine. */
const BUILD = '2026-09-03.45';
const newer = (a, b) => { if (!a || !b) return false; const [da, na] = a.split('.'), [db, nb] = b.split('.');
  return da > db || (da === db && (+na || 0) > (+nb || 0)); };
function showUpdate(build) { $('updateT').textContent = 'A NEW BUILD OF CASEMAKER IS AVAILABLE · ' + build + ' (YOU ARE ON ' + BUILD + ')'; $('update').classList.add('show'); }
$('updateGo').onclick = () => location.reload();
$('updateX').onclick = () => $('update').classList.remove('show');
try {
  const seen = localStorage.getItem('cm2.latestBuild');
  if (newer(seen, BUILD)) showUpdate(seen);
  if (!seen || newer(BUILD, seen)) localStorage.setItem('cm2.latestBuild', BUILD);
  addEventListener('storage', e => { if (e.key === 'cm2.latestBuild' && newer(e.newValue, BUILD)) showUpdate(e.newValue); });
} catch (_) { }
if (/^https?:/.test(location.protocol)) setInterval(() => {
  fetch(location.href, { cache: 'no-store' }).then(r => r.text()).then(t => {
    const m = t.match(/const BUILD = '([^']+)'/); if (m && newer(m[1], BUILD)) showUpdate(m[1]); }).catch(() => {});
}, 60000);

/* ---------- RENDER ---------- */
function render() {
  ISO_CACHE = null;                                                            // the model may have changed
  const planOn = UI.view === 'plan';
  $('plan').style.display = planOn ? 'block' : 'none'; $('partsView').style.display = planOn ? 'none' : 'block';
  document.querySelector('.tools').style.display = planOn ? '' : 'none';
  if (planOn) drawPlan(); else drawParts();
  drawIso(); inspector(); snapshot();
  $('undoBtn').disabled = !HIST.past.length; $('redoBtn').disabled = !HIST.future.length;
}
render();
</script>
</body></html>
