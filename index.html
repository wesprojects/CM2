<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>CASEMAKER 2</title>
<style>
:root{--bg:#0d0f13;--panel:#151922;--panel2:#1b2130;--line:#2a3242;--ink:#e7ecf5;--mute:#7d8798;
 --amber:#f5a524;--blue:#78aaff;--green:#5ecf8d;--red:#ff6b6b;--mono:'DM Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.5 var(--mono);letter-spacing:.02em;
 overflow:hidden;height:100vh;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
header{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:15px;letter-spacing:.22em;font-weight:700}
header .build{color:var(--mute);font-size:9px;letter-spacing:.14em}
header .job{margin-left:6px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 9px;width:170px}
header select{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 8px}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer;letter-spacing:.1em;font-size:10px}
.btn:hover{border-color:var(--mute)}
.btn.on{background:var(--amber);border-color:var(--amber);color:#131313;font-weight:700}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.35;cursor:default}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:64px minmax(0,1fr) 400px;position:relative}
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.rail button{width:44px;height:44px;border-radius:8px;background:transparent;border:1px solid transparent;cursor:pointer;
 color:var(--mute);font-size:9px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.rail button.on{background:var(--panel2);border-color:var(--line);color:var(--amber)}
.rail svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.tools{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);align-items:center}
.tools .hint{color:var(--mute);font-size:9.5px;letter-spacing:.08em;margin-left:8px}
#plan{flex:1;min-height:0;position:relative}
#plan svg{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px)}
#partsView{flex:1;min-height:0;overflow:auto;padding:16px;display:none}
#partsView table{width:100%;border-collapse:collapse;font-size:11px}
#partsView th{text-align:left;font-size:9px;letter-spacing:.14em;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line)}
#partsView td{padding:5px 8px;border-bottom:1px solid var(--line)}
#partsView tr.hw td{color:var(--mute)}
.stagefoot{display:flex;gap:10px;padding:8px 16px;border-top:1px solid var(--line);font-size:9px;color:var(--mute);letter-spacing:.1em}
.chip{border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:var(--panel)}
.side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.side .hd{padding:12px 16px 9px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.side .hd .k{font-size:11px;letter-spacing:.16em;color:var(--amber)}
.side .hd .s{color:var(--mute);font-size:10px;margin-top:2px}
.side .body{padding:12px 16px;overflow:auto;flex:1 1 auto;min-height:0}
.side .iso{border-top:1px solid var(--line);padding:10px 16px 14px;flex:0 0 auto}
.grp{margin-bottom:14px}
.grp>.t{font-size:9px;letter-spacing:.16em;color:var(--mute);margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:9px;color:var(--mute);letter-spacing:.08em}
label.f input,label.f select{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:11px;width:100%}
label.f .mm{color:var(--mute);font-size:9px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:7px 4px;cursor:pointer;font-size:9.5px;letter-spacing:.08em;color:var(--mute)}
.seg button.on{background:var(--amber);color:#131313;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(6,8,12,.78);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:min(96vw,1180px);max-height:92vh;overflow:auto;padding:18px 22px;width:100%}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mhead h2{margin:0;font-size:14px;letter-spacing:.2em}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sec{border:1px solid var(--line);border-radius:8px;padding:12px}
.sec h3{margin:0 0 8px;font-size:9px;letter-spacing:.16em;color:var(--amber)}
.sec input,.sec select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 9px}
.sec .mm{color:var(--mute);font-size:9px;margin-top:4px}
.flyout{position:absolute;left:64px;top:0;bottom:0;width:360px;background:var(--panel);border-right:1px solid var(--line);
 box-shadow:14px 0 30px rgba(0,0,0,.45);transform:translateX(-380px);transition:transform .18s ease,visibility 0s .18s;z-index:15;display:flex;flex-direction:column;visibility:hidden;pointer-events:none}
.flyout.open{transform:translateX(0);visibility:visible;pointer-events:auto;transition:transform .18s ease}
.flyout .fh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.flyout .fh .t{font-size:12px;letter-spacing:.2em;color:var(--amber);font-weight:700}
.flyout .fh .s{font-size:9px;letter-spacing:.1em;color:var(--mute);margin-top:2px}
.flyout .fh>div:first-child{min-width:0;margin-right:10px}
.flyout .fb{padding:14px 16px;overflow:auto;flex:1}
.flyout .note{font-size:10px;color:var(--mute);line-height:1.5;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;margin-top:10px}
.flyout .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hit{cursor:pointer}
.hit rect{pointer-events:all}
</style></head>
<body>
<header>
  <div><h1>CASEMAKER</h1><div class="build">BUILD 2026-09-01.8</div></div>
  <input class="job" id="job" value="NEW CASE">
  <select id="preset"><option value="">SAMPLE PARTS…</option></select>
  <div class="spacer"></div>
  <button class="btn" id="undoBtn" title="Ctrl+Z">UNDO</button>
  <button class="btn" id="redoBtn" title="Ctrl+Y">REDO</button>
  <button class="btn" id="newBtn">NEW</button>
  <button class="btn" id="saveBtn">SAVE</button>
  <button class="btn" id="loadBtn">LOAD</button>
  <input id="loadFile" type="file" accept=".casemaker2,.json" hidden>
  <button class="btn" id="optBtn">OPTIONS</button>
</header>
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <div class="flyout" id="flyout">
    <div class="fh"><div><div class="t" id="fyT"></div><div class="s" id="fyS"></div></div>
      <div style="display:flex;gap:6px;white-space:nowrap;flex:0 0 auto"><span id="fyFoot"></span><button class="btn" id="fyClose">CLOSE</button></div></div>
    <div class="fb" id="fyBody"></div>
  </div>
  <section class="stage">
    <div class="tools">
      <button class="btn" id="tShelf">ADD SHELF</button>
      <button class="btn" id="tDivider">ADD DIVIDER</button>
      <button class="btn danger" id="tDelete">DELETE</button>
      <button class="btn" id="tFit" title="Refit the drawing to the window">FIT</button>
      <span class="hint" id="toolHint">CLICK A PART OR A SPACE TO CONFIGURE IT · DRAG THE TOP, RIGHT SIDE OR CORNER TO RESIZE</span>
    </div>
    <div id="plan"></div>
    <div id="partsView"></div>
    <div class="stagefoot"><span class="chip" id="fCase"></span><span class="chip" id="fParts"></span><span class="chip" id="fSel"></span></div>
  </section>
  <aside class="side">
    <div class="hd"><div style="flex:1"><div class="k" id="selK">CASE</div><div class="s" id="selS"></div></div>
      <button class="btn danger" id="rmBtn" style="display:none">REMOVE</button></div>
    <div class="body" id="insp"></div>
    <div class="iso"><div class="grp"><div class="t" style="display:flex;justify-content:space-between;align-items:center">ISO<span class="seg" style="width:220px"><button id="isoFaces" class="on">FACES</button><button id="isoOpen">OPEN</button><button id="isoFinish">FINISH</button></span></div><div id="iso"></div></div></div>
  </aside>
</div>
<div class="modal" id="optModal" hidden><div class="mbox">
  <div class="mhead"><h2>OPTIONS</h2><button class="btn" id="optClose">CLOSE</button></div>
  <div class="tabs" id="optTabs"></div><div class="opts" id="optBody"></div>
</div></div>

<script>
/* ============================================================================
   CASEMAKER 2 — single file build. Sections:
     CORE   (inlined from core.mjs: units, model, spaces, drawers, parts, presets)
     STATE  the document and the selection
     PLAN   the elevation: parts, spaces, tools, drag
     ISO    NE isometric of parts()
     INSPECTOR / OPTIONS / PARTS LIST / SAVE-LOAD
   ============================================================================ */
/* ============================================================================
   CASEMAKER 2 — core model
   Sections in this file:
     1  UNITS + IDS          small helpers, stable part ids
     2  DEFAULTS             every tunable number in one place
     3  MODEL                the case: parts list, bay contents
     4  SPACES               recursive partition into openings
     5  DRAWERS              real box construction: sides, front/back, grooved bottom
     6  PARTS                the cut list the views and exports read
     7  PRESETS              the sample parts
   Nothing here touches the DOM. Views import from this only.
   ============================================================================ */

/* ---------- 1  UNITS + IDS ---------- */
const MM = 25.4;
const r4 = v => Math.round(v * 10000) / 10000;
const mm = v => v / MM;
let _id = 0;
const nextId = pre => pre + '-' + (++_id);
const resetIds = () => { _id = 0; };

/* ---------- 2  DEFAULTS ---------- */
const DEFAULTS = {
  case:   { W: 36, H: 48, D: 12, T: 1.03, backT: 1.03, kick: 2.75, kickInset: mm(1.5),
            top: 'over', bottom: 'between', back: 'full', backEdge: 'flush' },
  drawer: { faceGap: mm(2),          // between drawer faces
            sideReveal: mm(1),       // each side of a face
            slideClear: mm(13),      // per side, opening to box outside
            boxT: mm(12),            // drawer box sides / front / back
            bottomT: mm(5),          // drawer bottom
            grooveDepth: mm(6),      // bottom groove depth
            grooveUp: mm(10),        // groove above the box's bottom edge
            slotBottom: true,        // grooved, not captured under
            boxSlide: mm(400),       // box drawer slide length
            fileSlide: mm(510),      // file drawer slide length
            boxFaceH: mm(184), fileFaceH: mm(318),
            boxBoxH: mm(120), fileBoxH: mm(245),
            topGap: mm(3) },         // under the top panel when hung from it
  shelf:  { frontGap: mm(2), sideClear: mm(0.5), pinDia: 0.25, pinPitch: mm(32),
            pinFirst: 6.437, pinFront: 2, pinBack: 2 },
  door:   { reveal: mm(2), insetClear: mm(2), cupK: mm(28), thickness: null }
};

/* ---------- 3  MODEL ---------- */
function newCase(over = {}) {
  resetIds();
  return {
    job: 'NEW CASE',
    ...structuredClone(DEFAULTS.case), ...over,
    opt: structuredClone({ drawer: DEFAULTS.drawer, shelf: DEFAULTS.shelf, door: DEFAULTS.door }),
    shelves: [],     // {id, z, x0, x1}   fixed shelf, spans one opening
    dividers: [],    // {id, x, z0, z1}
    bays: {}         // spaceKey -> {shelves, content, drawers:{box,file}, heights:[]}
  };
}
/* A part records WHAT bounds its ends, not just where they are, so moving a shelf
   carries the dividers that land on it instead of orphaning them. */
const addShelf = (M, z, space) => {
  const p = { id: nextId('SH'), z: r4(z), leftRef: space?.leftOf ?? null, rightRef: space?.rightOf ?? null,
              x0: r4(space ? space.x0 : M.T), x1: r4(space ? space.x1 : M.W - M.T) };
  M.shelves.push(p); carrySettings(M, space); return p;
};
const addDivider = (M, x, space) => {
  const p = { id: nextId('DV'), x: r4(x), underRef: space?.under ?? null, overRef: space?.over ?? null,
              z0: r4(space ? space.z0 : M.kick + M.T), z1: r4(space ? space.z1 : M.H - M.T) };
  M.dividers.push(p); carrySettings(M, space); return p;
};
/* a split space hands its settings to the child that keeps its bottom-left corner */
function carrySettings(M, space) {
  if (!space || !M.bays[space.key]) return;
  const kid = spaces(M).find(c => Math.abs(c.x0 - space.x0) < 0.01 && Math.abs(c.z0 - space.z0) < 0.01);
  if (kid && kid.key !== space.key) { M.bays[kid.key] = M.bays[space.key]; delete M.bays[space.key]; }
}
/* resolve a part's ends from its references every time the model is read */
function resolveEnds(M) {
  const T = M.T;
  const floor = M.bottom === 'none' ? M.kick : r4(M.kick + T);
  const ceil  = M.top === 'none' ? M.H : r4(M.H - T);
  M.dividers.forEach(d => {
    const u = d.underRef && M.shelves.find(s => s.id === d.underRef);
    const o = d.overRef  && M.shelves.find(s => s.id === d.overRef);
    d.z0 = u ? r4(u.z + T) : floor;                                    // sits on the shelf it was drawn above
    d.z1 = o ? r4(o.z)     : ceil;
  });
  M.shelves.forEach(s => {
    const l = s.leftRef  && M.dividers.find(d => d.id === s.leftRef);
    const r = s.rightRef && M.dividers.find(d => d.id === s.rightRef);
    s.x0 = r ? r4(r.x + T / 2) : T;                                    // rightRef is the divider on its LEFT edge
    s.x1 = l ? r4(l.x - T / 2) : r4(M.W - T);
  });
}
const dropPart   = (M, id) => { M.shelves = M.shelves.filter(p => p.id !== id); M.dividers = M.dividers.filter(p => p.id !== id); };
/* resize the carcass and scale every shelf and divider with it */
function resizeCase(M, W, H) {
  const T = M.T, oldIn = M.W - 2 * T, newIn = Math.max(4, W) - 2 * T;
  const oldFloor = M.bottom === 'none' ? M.kick : M.kick + T, oldCeil = (M.top === 'none' ? M.H : M.H - T);
  const newH = Math.max(6, H), newCeil = (M.top === 'none' ? newH : newH - T);
  const fx = newIn / oldIn, fz = (newCeil - oldFloor) / (oldCeil - oldFloor);
  M.dividers.forEach(d => d.x = r4(T + (d.x - T) * fx));
  M.shelves.forEach(s => s.z = r4(oldFloor + (s.z - oldFloor) * fz));
  M.W = r4(Math.max(4, W)); M.H = r4(newH);
}
function bayOf(M, key) {
  if (!M.bays[key]) M.bays[key] = { shelves: 0, content: 'open', drawers: { box: 0, file: 0 }, heights: [], grommet: null };
  return M.bays[key];
}

/* ---------- 4  SPACES ---------- */
/* A space is bounded by the carcass and by whatever shelves and dividers span it.
   Keyed by the parts that bound it, so an assignment survives a part being moved. */
function spaces(M) {
  resolveEnds(M);
  const T = M.T, res = [];
  const floor = M.bottom === 'none' ? M.kick : r4(M.kick + T);
  const ceil  = M.top === 'none' ? M.H : r4(M.H - T);
  (function cut(r, depth) {
    if (depth > 8) { res.push(r); return; }
    const sh = M.shelves.find(s => s.z > r.z0 + 0.01 && s.z + T < r.z1 - 0.01 &&
                                   s.x0 <= r.x0 + 0.01 && s.x1 >= r.x1 - 0.01);
    /* the region below the shelf has the shelf OVER it; the region above has it UNDER */
    if (sh) { cut({ ...r, z1: sh.z, over: sh.id }, depth + 1);
              cut({ ...r, z0: r4(sh.z + T), under: sh.id }, depth + 1); return; }
    const dv = M.dividers.find(d => d.x - T / 2 > r.x0 + 0.01 && d.x + T / 2 < r.x1 - 0.01 &&
                                    d.z0 <= r.z0 + 0.01 && d.z1 >= r.z1 - 0.01);
    if (dv) { cut({ ...r, x1: r4(dv.x - T / 2), rightOf: r.rightOf, leftOf: dv.id }, depth + 1);
              cut({ ...r, x0: r4(dv.x + T / 2), rightOf: dv.id, leftOf: r.leftOf }, depth + 1); return; }
    res.push(r);
  })({ x0: T, x1: r4(M.W - T), z0: floor, z1: ceil }, 0);

  res.sort((a, b) => a.z0 - b.z0 || a.x0 - b.x0);
  const rows = [...new Set(res.map(c => c.z0))];
  res.forEach(c => {
    c.w = r4(c.x1 - c.x0); c.h = r4(c.z1 - c.z0);
    c.key = [c.under || '_', c.over || '_', c.leftOf || '_', c.rightOf || '_'].join('|');
    const row = rows.indexOf(c.z0) + 1, sib = res.filter(q => q.z0 === c.z0);
    c.id = String.fromCharCode(64 + row) + (sib.findIndex(q => q.x0 === c.x0) + 1);
  });
  return res;
}

/* ---------- 5  DRAWERS ----------
   One stack per space. Every drawer is: a face, two box sides, a box front and back,
   and a bottom. With slotBottom the bottom sits in a groove all round and the box
   sides/front/back are full height; otherwise the bottom is captured underneath.
   The box is sized from the opening less the slide clearance per side, so slide
   hardware drops straight in.                                                        */
function drawerStack(M, space, bay) {
  const O = M.opt.drawer, T = M.T, out = [];
  const nb = bay.drawers.box | 0, nf = bay.drawers.file | 0;
  if (!(nb + nf)) return out;

  const kinds = [...Array(nf).fill('FILE'), ...Array(nb).fill('BOX')];     // files at the bottom
  const faceH = (kind, i) => {
    const list = bay.heights || [];
    if (list[i] != null) return list[i];
    return kind === 'FILE' ? O.fileFaceH : O.boxFaceH;
  };
  const inside = r4(M.back === 'none' ? M.D : M.D - M.backT);              // usable depth
  const opening = r4(space.x1 - space.x0);
  const boxOutside = r4(opening - 2 * O.slideClear);                        // slide clearance per side
  const boxInside  = r4(boxOutside - 2 * O.boxT);

  /* Faces and boxes are separate. A face is applied to the FRONT, so it covers the
     top and bottom panels where the opening reaches them; the box always stays inside
     the opening. That is why a pedestal's faces add up to more than its opening. */
  const T2 = M.T;
  const floor = M.bottom === 'none' ? M.kick : r4(M.kick + T2);
  const ceil  = M.top === 'none' ? M.H : r4(M.H - T2);
  const faceZ0 = space.z0 <= floor + 0.01 ? M.kick : space.z0;           // reaches the bottom: cover it
  const faceZ1 = space.z1 >= ceil - 0.01 ? r4(M.H - O.topGap) : space.z1; // reaches the top: cover it, less the gap
  const heights = kinds.map((k, i) => faceH(k, i));
  const total = r4(heights.reduce((a, v) => a + v, 0) + O.faceGap * (kinds.length - 1));
  const room  = r4(faceZ1 - faceZ0);
  const scale = total > room ? room / total : 1;                         // never overflow the front
  const align = bay.align || 'bottom';
  let z = align === 'top' ? r4(faceZ1 - total * scale) : faceZ0;

  kinds.forEach((kind, i) => {
    const fh = r4(heights[i] * scale);
    const roomUp = r4(space.z1 - Math.max(z + 0.25, space.z0 + 0.25) - 0.1);
    const boxH = Math.max(1, Math.min(kind === 'FILE' ? O.fileBoxH : O.boxBoxH, r4(fh - 0.25), roomUp));
    const slide = kind === 'FILE' ? O.fileSlide : O.boxSlide;
    const boxDepth = Math.min(slide, r4(inside - 0.25));
    const setback = r4(Math.max(0, inside - boxDepth));                     // box sits back from the front
    const faceW = r4(opening + T - 2 * O.sideReveal);                       // laps the parts either side
    const faceX = r4(space.x0 - T / 2 + O.sideReveal);
    const boxX  = r4(space.x0 + O.slideClear);
    const boxZ  = r4(Math.max(z + 0.25, space.z0 + 0.25));                 // the box stays inside the opening

    out.push({ id: nextId('DF'), role: 'face', kind, name: kind + ' DRAWER FRONT',
               w: faceW, h: r4(fh), t: T, qty: 1,
               box: { min: [faceX, -T, r4(z)], max: [r4(faceX + faceW), 0, r4(z + fh)] } });

    /* two sides — full box depth, grooved for the bottom */
    out.push({ id: nextId('DS'), role: 'side', kind, name: kind + ' DRAWER SIDE',
               w: boxDepth, h: boxH, t: O.boxT, qty: 2, groove: O.slotBottom ? O.grooveUp : null,
               boxes: [
                 { min: [boxX, setback, boxZ], max: [r4(boxX + O.boxT), r4(setback + boxDepth), r4(boxZ + boxH)] },
                 { min: [r4(boxX + O.boxT + boxInside), setback, boxZ],
                   max: [r4(boxX + boxOutside), r4(setback + boxDepth), r4(boxZ + boxH)] } ] });

    /* front and back of the box, between the sides */
    out.push({ id: nextId('DB'), role: 'frontback', kind, name: kind + ' DRAWER FRONT/BACK',
               w: boxInside, h: boxH, t: O.boxT, qty: 2, groove: O.slotBottom ? O.grooveUp : null,
               boxes: [
                 { min: [r4(boxX + O.boxT), setback, boxZ],
                   max: [r4(boxX + O.boxT + boxInside), r4(setback + O.boxT), r4(boxZ + boxH)] },
                 { min: [r4(boxX + O.boxT), r4(setback + boxDepth - O.boxT), boxZ],
                   max: [r4(boxX + O.boxT + boxInside), r4(setback + boxDepth), r4(boxZ + boxH)] } ] });

    /* bottom: in the groove all round, or captured under the box */

function adjShelfZ(M, c, n) {   // the heights adjustable shelves land at, for the views
  const O = M.opt.shelf, T = M.T, out = [];
  for (let i = 1; i <= n; i++) { const want = c.z0 + (c.z1 - c.z0) * i / (n + 1);
    const k = Math.round((want - O.pinDia / 2 - O.pinFirst) / O.pinPitch);
    out.push(r4(Math.min(Math.max(O.pinFirst + k * O.pinPitch + O.pinDia / 2, c.z0 + 1), c.z1 - T - 1))); }
  return out;
}
function parts(M) {
  const T = M.T, out = [], P = (name, w, h, t, box, extra = {}) =>
    out.push({ id: nextId('P'), name, w: r4(w), h: r4(h), t: r4(t), qty: 1, box, ...extra });

  const sideTop = M.top === 'over' ? r4(M.H - T) : M.H;
  P('LEFT SIDE',  sideTop, M.D, T, { min: [0, 0, 0], max: [T, M.D, sideTop] });                  // sides stand on the floor
  P('RIGHT SIDE', sideTop, M.D, T, { min: [r4(M.W - T), 0, 0], max: [M.W, M.D, sideTop] });
  if (M.top !== 'none')
    P('TOP', M.top === 'over' ? M.W : r4(M.W - 2 * T), M.D, T,
      { min: [M.top === 'over' ? 0 : T, 0, r4(M.H - T)], max: [M.top === 'over' ? M.W : r4(M.W - T), M.D, M.H] });
  if (M.bottom !== 'none')
    P('BOTTOM', r4(M.W - 2 * T), M.D, T, { min: [T, 0, M.kick], max: [r4(M.W - T), M.D, r4(M.kick + T)] });
  if (M.kick > 0)
    P('KICK BOARD', r4(M.W - 2 * T), M.kick, T,                                              // between the sides, set back from the front
      { min: [T, M.kickInset, 0], max: [r4(M.W - T), r4(M.kickInset + T), M.kick] });
  if (M.back !== 'none') {
    const y0 = M.backEdge === 'flush' ? r4(M.D - M.backT) : r4(M.D - M.backT - mm(1));
    P('BACK PANEL', r4(M.W - 2 * T), r4(M.H - M.kick - T), M.backT,
      { min: [T, y0, r4(M.kick + T)], max: [r4(M.W - T), r4(y0 + M.backT), r4(M.H - T)] });
  }
  const backY = M.back === 'none' ? M.D : r4(M.D - M.backT);
  M.shelves.forEach((s, i) => P('FIXED SHELF ' + (i + 1), r4(s.x1 - s.x0), backY, T,
    { min: [s.x0, 0, s.z], max: [s.x1, backY, r4(s.z + T)] }, { partId: s.id }));
  M.dividers.forEach((d, i) => P('DIVIDER ' + (i + 1), r4(d.z1 - d.z0), backY, T,
    { min: [r4(d.x - T / 2), 0, d.z0], max: [r4(d.x + T / 2), backY, d.z1] }, { partId: d.id }));

  spaces(M).forEach(c => {
    const b = bayOf(M, c.key);
    const O = M.opt.shelf;
    for (let i = 1; i <= b.shelves; i++) {
      const want = c.z0 + (c.z1 - c.z0) * i / (b.shelves + 1);
      const k = Math.round((want - O.pinDia / 2 - O.pinFirst) / O.pinPitch);   // nearest pin row
      const z = r4(Math.min(Math.max(O.pinFirst + k * O.pinPitch + O.pinDia / 2, c.z0 + 1), c.z1 - T - 1));
      P('ADJ SHELF', r4(c.w - 2 * O.sideClear), r4(backY - O.frontGap), T,
        { min: [r4(c.x0 + O.sideClear), O.frontGap, z], max: [r4(c.x1 - O.sideClear), backY, r4(z + T)] });
    }
    if (b.content === 'drawers') drawerStack(M, c, b).forEach(p => out.push(p));
    if (b.content === 'door' || b.content === 'doors2') {
      const O2 = M.opt.door, n = b.content === 'doors2' ? 2 : 1;
      const w = r4((c.w + T - 2 * O2.reveal - (n - 1) * O2.reveal) / n);
      for (let i = 0; i < n; i++)
        P(n === 2 ? 'DOOR ' + (i ? 'R' : 'L') : 'DOOR', w, r4(c.h - 2 * O2.reveal), T,
          { min: [r4(c.x0 - T / 2 + O2.reveal + i * (w + O2.reveal)), -T, r4(c.z0 + O2.reveal)],
            max: [r4(c.x0 - T / 2 + O2.reveal + i * (w + O2.reveal) + w), 0, r4(c.z1 - O2.reveal)] });
    }

}

/* ---------- NEST: shelf packing of rectangles, grain along the sheet length ---------- */
function nestParts(o) {
  const [SW, SL] = o.sheet.split(',').map(Number), gap = o.gap, mar = o.margin;
  const items = [];
  parts(M).forEach(p => { if (p.hardware) return;
    for (let i = 0; i < p.qty; i++) items.push({ name: p.name, w: p.w, h: p.h, t: p.t, groove: p.groove }); });
  /* the grain runs with the sheet length: a part's LENGTH lies along the sheet length */
  items.forEach(it => { let a = it.w, b = it.h;               // a along the sheet length, b across
    if (o.grain === 'any' && a > SL - 2 * mar && b <= SL - 2 * mar) [a, b] = [b, a];
    it.a = a; it.b = b; });
  items.sort((x, y) => y.b - x.b || y.a - x.a);
  const sheets = [];
  items.forEach(it => {
    if (it.a > SL - 2 * mar || it.b > SW - 2 * mar) { it.skip = true; return; }
    let placed = false;
    for (const sh of sheets) { for (const row of sh.rows) {
        if (it.b <= row.h + 1e-6 && row.x + it.a <= SL - mar + 1e-6) { it.x = row.x; it.y = row.y; row.x += it.a + gap; sh.items.push(it); placed = true; break; } }
      if (placed) break;
      const yNext = sh.rows.length ? sh.rows[sh.rows.length - 1].y + sh.rows[sh.rows.length - 1].h + gap : mar;
      if (yNext + it.b <= SW - mar + 1e-6) { sh.rows.push({ y: yNext, h: it.b, x: mar + it.a + gap }); it.x = mar; it.y = yNext; sh.items.push(it); placed = true; break; } }
    if (!placed) { const sh = { W: SW, L: SL, rows: [{ y: mar, h: it.b, x: mar + it.a + gap }], items: [] }; it.x = mar; it.y = mar; sh.items.push(it); sheets.push(sh); } });
  const skipped = items.filter(i => i.skip);
  if (skipped.length) alert(skipped.length + ' part(s) are longer than the sheet and were left out: ' + [...new Set(skipped.map(i => i.name))].join(', '));
  return sheets;
}
/* R12 DXF: POLYLINE outlines, LINE grooves, TEXT labels. Layer count written from the real table. */
function dxfSheet(sh, i, n, o) {
  const L = [], w = (c, v) => L.push(c, v);
  const layers = ['OUTLINE', 'SHEET', 'TEXT', 'GROOVE'];
  w(0, 'SECTION'); w(2, 'HEADER'); w(9, '$ACADVER'); w(1, 'AC1009');
  w(9, '$EXTMIN'); w(10, 0); w(20, 0); w(30, 0); w(9, '$EXTMAX'); w(10, sh.L.toFixed(4)); w(20, (sh.W + 2).toFixed(4)); w(30, 0);
  w(0, 'ENDSEC');
  w(0, 'SECTION'); w(2, 'TABLES'); w(0, 'TABLE'); w(2, 'LAYER'); w(70, layers.length);
  layers.forEach((l, k) => { w(0, 'LAYER'); w(2, l); w(70, 0); w(62, [7, 8, 8, 5][k]); w(6, 'CONTINUOUS'); });
  w(0, 'ENDTAB'); w(0, 'ENDSEC'); w(0, 'SECTION'); w(2, 'ENTITIES');
  const rect = (lay, x, y, a, b) => { w(0, 'POLYLINE'); w(8, lay); w(66, 1); w(70, 1); w(10, 0); w(20, 0); w(30, 0);
    [[x, y], [x + a, y], [x + a, y + b], [x, y + b]].forEach(([px, py]) => { w(0, 'VERTEX'); w(8, lay); w(10, px.toFixed(4)); w(20, py.toFixed(4)); w(30, 0); });
    w(0, 'SEQEND'); w(8, lay); };
  const line = (lay, x1, y1, x2, y2) => { w(0, 'LINE'); w(8, lay); w(10, x1.toFixed(4)); w(20, y1.toFixed(4)); w(30, 0); w(11, x2.toFixed(4)); w(21, y2.toFixed(4)); w(31, 0); };
  const text = (lay, x, y, hgt, str) => { w(0, 'TEXT'); w(8, lay); w(10, x.toFixed(4)); w(20, y.toFixed(4)); w(30, 0); w(40, hgt); w(1, str); };
  rect('SHEET', 0, 0, sh.L, sh.W);
  text('TEXT', 0.5, sh.W + 0.5, 1, 'CASE SHEET ' + (i + 1) + ' of ' + n + '  ' + sh.W + ' x ' + sh.L + '  ' + (M.job || '') + '  GRAIN RUNS WITH THE SHEET LENGTH');
  sh.items.forEach(it => { rect('OUTLINE', it.x, it.y, it.a, it.b);
    if (it.groove != null) line('GROOVE', it.x, it.y + it.groove, it.x + it.a, it.y + it.groove);
    text('TEXT', it.x + 0.3, it.y + 0.3, Math.min(0.6, it.b / 4), it.name + '  ' + it.a.toFixed(3) + ' x ' + it.b.toFixed(3)); });
  w(0, 'ENDSEC'); w(0, 'EOF');
  return L.join('\n') + '\n';
}

/* ---------- 3D: boxes to triangles ---------- */
function boxTris(b, k) { const [x0, y0, z0] = b.min.map(v => v * k), [x1, y1, z1] = b.max.map(v => v * k);
  const v = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
  const q = [[0, 3, 2, 1], [4, 5, 6, 7], [0, 1, 5, 4], [1, 2, 6, 5], [2, 3, 7, 6], [3, 0, 4, 7]], t = [];
  q.forEach(f => { t.push([v[f[0]], v[f[1]], v[f[2]]], [v[f[0]], v[f[2]], v[f[3]]]); }); return t; }
function stlBinary(ps, k) {
  const tris = []; ps.forEach(p => (p.boxes || [p.box]).forEach(b => { if (b) boxTris(b, k).forEach(t => tris.push(t)); }));
  const buf = new ArrayBuffer(84 + tris.length * 50), dv = new DataView(buf); dv.setUint32(80, tris.length, true);
  tris.forEach((t, i) => { const o = 84 + i * 50; const [a, b, c] = t, u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], w2 = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
    const nrm = [u[1] * w2[2] - u[2] * w2[1], u[2] * w2[0] - u[0] * w2[2], u[0] * w2[1] - u[1] * w2[0]], len = Math.hypot(...nrm) || 1;
    [nrm[0] / len, nrm[1] / len, nrm[2] / len, ...a, ...b, ...c].forEach((f, j) => dv.setFloat32(o + j * 4, f, true)); dv.setUint16(o + 48, 0, true); });
  return buf; }
function objText(ps, k) { const out = ['# CASEMAKER 2 ' + stamp()]; let n = 0;
  ps.forEach(p => (p.boxes || [p.box]).forEach((b, i) => { if (!b) return; out.push('o ' + p.name.replace(/\s+/g, '_') + (p.qty > 1 ? '_' + (i + 1) : ''));
    boxTris(b, k).forEach(t => { t.forEach(v => out.push('v ' + v.map(x => x.toFixed(4)).join(' '))); out.push('f ' + (n + 1) + ' ' + (n + 2) + ' ' + (n + 3)); n += 3; }); }));
  return out.join('\n') + '\n'; }
function daeText(ps, k, units) { const geos = [], nodes = [];
  ps.forEach(p => (p.boxes || [p.box]).forEach((b, i) => { if (!b) return; const id = (p.name + (p.qty > 1 ? '_' + (i + 1) : '')).replace(/[^A-Za-z0-9]/g, '_'), tris = boxTris(b, k);
    const pos = tris.flatMap(t => t.flatMap(v => v)), idx = tris.flatMap((t, j) => [j * 3, j * 3 + 1, j * 3 + 2]);
    geos.push('<geometry id="g_' + id + '"><mesh><source id="p_' + id + '"><float_array id="a_' + id + '" count="' + pos.length + '">' + pos.map(x => x.toFixed(4)).join(' ') + '</float_array>' +
      '<technique_common><accessor source="#a_' + id + '" count="' + (pos.length / 3) + '" stride="3"><param name="X" type="float"/><param name="Y" type="float"/><param name="Z" type="float"/></accessor></technique_common></source>' +
      '<vertices id="v_' + id + '"><input semantic="POSITION" source="#p_' + id + '"/></vertices><triangles count="' + tris.length + '"><input semantic="VERTEX" source="#v_' + id + '" offset="0"/><p>' + idx.join(' ') + '</p></triangles></mesh></geometry>');
    nodes.push('<node id="n_' + id + '" name="' + id + '"><instance_geometry url="#g_' + id + '"/></node>'); }));
  return '<?xml version="1.0" encoding="utf-8"?><COLLADA xmlns="http://www.collada.org/2005/11/COLLADASchema" version="1.4.1"><asset><unit name="' + (units === 'mm' ? 'millimeter' : 'inch') + '" meter="' + (units === 'mm' ? 0.001 : 0.0254) + '"/><up_axis>Z_UP</up_axis></asset>' +
    '<library_geometries>' + geos.join('') + '</library_geometries><library_visual_scenes><visual_scene id="S">' + nodes.join('') + '</visual_scene></library_visual_scenes><scene><instance_visual_scene url="#S"/></scene></COLLADA>'; }

            ['fileSlide', 'FILE SLIDE LENGTH'], ['boxFaceH', 'BOX FACE HEIGHT'], ['fileFaceH', 'FILE FACE HEIGHT'], ['boxBoxH', 'BOX DRAWER BOX HEIGHT'],
            ['fileBoxH', 'FILE DRAWER BOX HEIGHT'], ['topGap', 'GAP UNDER THE TOP']],
  SHELVES: [['frontGap', 'FRONT GAP'], ['sideClear', 'SIDE CLEARANCE EACH'], ['pinDia', 'PIN DIAMETER'], ['pinPitch', 'PIN PITCH'], ['pinFirst', 'FIRST HOLE'], ['pinFront', 'PINS FROM FRONT'], ['pinBack', 'PINS FROM BACK']],
  DOORS: [['reveal', 'REVEAL'], ['insetClear', 'INSET CLEARANCE'], ['cupK', 'CUP K']]
};
let optTab = 'DRAWERS';
function drawOpts() {
  $('optTabs').innerHTML = Object.keys(OPT).map(t => '<button class="btn ' + (t === optTab ? 'on' : '') + '" data-t="' + t + '">' + t + '</button>').join('');
  $('optTabs').querySelectorAll('button').forEach(b => b.onclick = () => { optTab = b.dataset.t; drawOpts(); });
  const grp = optTab === 'DRAWERS' ? M.opt.drawer : optTab === 'SHELVES' ? M.opt.shelf : M.opt.door;
  $('optBody').innerHTML = OPT[optTab].map(([k, l]) => '<div class="sec"><h3>' + l + '</h3><input data-k="' + k + '" type="number" step="0.0001" value="' + r3(grp[k]) + '"><div class="mm">= ' + (grp[k] * MM).toFixed(1) + ' mm</div></div>').join('');
  $('optBody').querySelectorAll('input').forEach(i => i.onchange = () => { grp[i.dataset.k] = parseFloat(i.value); drawOpts(); render(); });
}
$('optBtn').onclick = () => { drawOpts(); $('optModal').hidden = false; };
$('optClose').onclick = () => { $('optModal').hidden = true; };
$('optModal').addEventListener('click', e => { if (e.target === $('optModal')) $('optModal').hidden = true; });

/* ---------- PRESETS / NEW / SAVE / LOAD ---------- */
Object.entries(PRESETS).forEach(([k, p]) => { const o = document.createElement('option'); o.value = k; o.textContent = k + ' · ' + p.label; $('preset').appendChild(o); });
$('preset').onchange = () => { if (!$('preset').value) return; M = loadPreset($('preset').value); HIST.past = []; HIST.future = []; HIST.last = null; UI.sc = null; UI.sel = { kind: 'case' }; $('job').value = M.job; render(); };
$('undoBtn').onclick = undo; $('redoBtn').onclick = redo;
$('newBtn').onclick = () => { M = newCase(); HIST.past = []; HIST.future = []; HIST.last = null; UI.sc = null; UI.sel = { kind: 'case' }; $('preset').value = ''; $('job').value = M.job; render(); };
$('job').onchange = () => { M.job = $('job').value; };
$('saveBtn').onclick = () => {
  const doc = { format: 'CASEMAKER2', version: 1, build: '2026-09-01.8', saved: new Date().toISOString(), model: M };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(doc)], { type: 'application/json' }));
  a.download = (M.job || 'CASE').replace(/\s+/g, '_') + '_' + '2026-09-01.8'.slice(0, 10) + '.casemaker2'; a.click(); URL.revokeObjectURL(a.href); };
$('loadBtn').onclick = () => $('loadFile').click();
$('loadFile').onchange = e => { const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { try { const d = JSON.parse(t); if (d.format !== 'CASEMAKER2') throw new Error('not a CASEMAKER 2 file');
      M = d.model; UI.sel = { kind: 'case' }; UI.sc = null; $('job').value = M.job || 'NEW CASE'; render(); }
    catch (err) { alert('Could not load: ' + err.message); } }); e.target.value = ''; };

/* ---------- RENDER ---------- */
function render() {
  const planOn = UI.view === 'plan';
  $('plan').style.display = planOn ? 'block' : 'none'; $('partsView').style.display = planOn ? 'none' : 'block';
  document.querySelector('.tools').style.display = planOn ? '' : 'none';
  if (planOn) drawPlan(); else drawParts();
  drawIso(); inspector(); snapshot();
  $('undoBtn').disabled = !HIST.past.length; $('redoBtn').disabled = !HIST.future.length;
}
render();
</script>
</body></html>
