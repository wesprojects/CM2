    '<asset><contributor><authoring_tool>CASEMAKER 2</authoring_tool></contributor><unit meter="' + (units === 'mm' ? 0.001 : 0.0254) + '" name="' + (units === 'mm' ? 'millimeter' : 'inch') + '"/><up_axis>Z_UP</up_axis></asset>' +
    '<library_effects><effect id="fxMetal"><profile_COMMON><technique sid="common"><phong><diffuse><color>0.62 0.64 0.68 1</color></diffuse><specular><color>0.9 0.9 0.9 1</color></specular><shininess><float>40</float></shininess></phong></technique></profile_COMMON></effect><effect id="fxWood"><profile_COMMON><technique sid="common"><lambert><diffuse><color>' + (o3.finish ? (o3.finish === 'cherry' ? '0.69 0.42 0.24 1' : '0.60 0.63 0.68 1') : '0.72 0.55 0.38 1') + '</color></diffuse></lambert></technique></profile_COMMON></effect></library_effects>' + '<library_materials><material id="matWood" name="TFL"><instance_effect url="#fxWood"/></material><material id="matMetal" name="Hardware"><instance_effect url="#fxMetal"/></material></library_materials>' +
    '<library_geometries>' + geos.join('') + '</library_geometries>' +
    '<library_nodes>' + libs.join('') + '</library_nodes>' +
    '<library_visual_scenes><visual_scene id="scene" name="' + stamp() + '">' + nodes.join('') + '</visual_scene></library_visual_scenes>' +
    '<scene><instance_visual_scene url="#scene"/></scene></COLLADA>';
}

/* ---------- OPTIONS ---------- */
const OPT = {
  DRAWERS: [['faceGap', 'GAP BETWEEN FACES'], ['sideReveal', 'FACE SIDE REVEAL'], ['slideClear', 'SLIDE CLEARANCE PER SIDE'], ['boxT', 'BOX SIDES THICKNESS'],
            ['bottomT', 'BOTTOM THICKNESS'], ['grooveDepth', 'GROOVE DEPTH'], ['grooveUp', 'GROOVE UP FROM BOTTOM EDGE'], ['boxSlide', 'BOX SLIDE LENGTH'],
            ['fileSlide', 'FILE SLIDE LENGTH'], ['boxFaceH', 'BOX FACE HEIGHT'], ['fileFaceH', 'FILE FACE HEIGHT'], ['boxBoxH', 'BOX DRAWER BOX HEIGHT'],
            ['fileBoxH', 'FILE DRAWER BOX HEIGHT'], ['topGap', 'GAP UNDER THE TOP']],
  SHELVES: [['frontGap', 'FRONT GAP'], ['sideClear', 'SIDE CLEARANCE EACH'], ['pinDia', 'PIN DIAMETER'], ['pinPitch', 'PIN PITCH'], ['pinFirst', 'FIRST HOLE'], ['pinFront', 'PINS FROM FRONT'], ['pinBack', 'PINS FROM BACK']],
  DOORS: [['style', 'DOOR STYLE', 'sel', [['inset', 'INSET - FLUSH IN THE OPENING'], ['overlay', 'OVERLAY - ON THE FRONT']]],
          ['insetClear', 'INSET CLEARANCE PER SIDE'], ['reveal', 'OVERLAY REVEAL'], ['cupK', 'CUP CENTRE FROM THE DOOR EDGE'], ['bottomZ', 'DOOR BOTTOM FROM THE FLOOR (OVERLAY)']],
  JOINERY: [['inset', 'CAM PIN LENGTH B (CAM CENTRE FROM EDGE)'], ['ctr', 'PIN LINE FROM THE CAM FACE'], ['camD', 'CAM NUT DIAMETER'], ['camZ', 'CAM BORE DEPTH'],
            ['pinED', 'PIN EDGE DIAMETER'], ['pinEZ', 'PIN EDGE DEPTH'], ['pinFD', 'PIN FACE INSERT DIAMETER'], ['pinFZ', 'PIN FACE DEPTH'], ['dowD', 'DOWEL DIAMETER'], ['dowEZ', 'DOWEL EDGE DEPTH'], ['dowFZ', 'DOWEL FACE DEPTH'],
            ['camSp', 'CAM SPACING'], ['dowOff', 'DOWEL BESIDE CAM'], ['front', 'FIRST CAM FROM FRONT'], ['back', 'LAST CAM FROM BACK'], ['dowSp', 'DOWEL SPACING WITHOUT CAMS']],
  GLIDES: [['type', 'TYPE', 'sel', [['glide', 'LEVELLING GLIDE'], ['caster', 'SWIVEL CASTER'], ['pin', 'CAM PIN \u00b7 FIXES DOWN TO THE CASE BELOW'], ['none', 'NONE']]],
           ['where', 'WHERE', 'sel', [['sides', 'SIDE PANELS \u00b7 BOTTOM EDGES'], ['bottom', 'BOTTOM PANEL \u00b7 UNDERSIDE (CASTERS)']]],
           ['D', 'BORE DIAMETER'], ['Z', 'BORE DEPTH'], ['inY', 'IN FROM THE ENDS'], ['inX', 'IN FROM THE SIDES (UNDERSIDE ONLY)']]
};
let optTab = 'DRAWERS', optTop = 'HARDWARE';
function drawOpts() {
  $('optTabs').innerHTML = ['HARDWARE', 'SETTINGS'].map(t => '<button class="btn ' + (t === optTop ? 'on' : '') + '" data-top="' + t + '">' + t + '</button>').join('') +
    (optTop === 'SETTINGS' ? '<span style="width:14px"></span>' + Object.keys(OPT).map(t => '<button class="btn sm ' + (t === optTab ? 'on' : '') + '" data-t="' + t + '">' + t + '</button>').join('') : '');
  $('optTabs').querySelectorAll('[data-top]').forEach(b => b.onclick = () => { optTop = b.dataset.top; drawOpts(); });
  $('optTabs').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { optTab = b.dataset.t; drawOpts(); });
  if (optTop === 'HARDWARE') { const n = hwCounts(parts(M));
    const modelUse = hwModelUse();
    $('optBody').style.display = 'block';
    $('optBody').innerHTML =
      '<div style="font-size:10px;color:var(--mute);line-height:1.7;margin-bottom:12px">EVERY PIECE CARRIES ITS ORIGIN AT THE CENTRE OF ITS MAIN BORE, ON THE FACE IT MOUNTS AGAINST \u00b7 +Z INTO THE PANEL ALONG THE BORE \u00b7 +X TOWARD ITS SECOND HOLE. MCMASTER-CARR STEP / DWG / PDF DRAWINGS DROP ONTO THE SAME ORIGIN. MODELS, DEFAULTS AND NUMBERS SAVE WITH THE JOB. \u25CF = THE DEFAULT \u2014 ANY PLACE A PIECE IS USED CAN PICK ANOTHER MODEL.</div>' +
      HWCAT.map(c => { const list = hwModels(c.id), def = hwDefault(c.id);
        return '<div style="margin-bottom:14px"><div style="display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:2px">' +
          '<span style="color:var(--amber);font-weight:700;font-size:11px;letter-spacing:.06em">' + c.name + '</span>' +
          '<span style="color:var(--mute);font-size:9.5px">' + c.on + '</span><span style="flex:1"></span>' +
          '<span style="color:' + (n[c.id] ? 'var(--amber)' : 'var(--mute)') + ';font-size:10px">' + (n[c.id] ? n[c.id] + ' IN THIS CASE' : '\u2014') + '</span></div>' +
          (list.length ? '<table style="width:100%;border-collapse:collapse;font-size:10.5px"><tbody>' + list.map((m2, i2) =>
            '<tr><td style="width:26px;padding:3px 4px"><button class="btn sm' + (i2 === def ? ' on' : '') + '" data-hwdef="' + c.id + ':' + i2 + '" title="Make this the default">' + (i2 === def ? '\u25CF' : '\u25CB') + '</button></td>' +
            '<td style="color:var(--ink);padding:3px 4px">' + m2.name + (m2.dims ? ' <span style="color:var(--mute);font-size:9px">' + hwDimsLine(m2.dims) + '</span>' : '') + '</td>' +
            '<td style="width:120px"><input data-hwmc="' + c.id + ':' + i2 + '" value="' + (m2.mcm || '') + '" placeholder="MCMASTER #" style="width:104px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--ink);font:inherit;padding:2px 5px"></td>' +
            '<td style="width:70px;text-align:right;color:var(--mute);font-size:10px">' + ((modelUse[c.id] || {})[i2] ? (modelUse[c.id] || {})[i2] + ' USED' : '') + '</td>' +
            '<td style="width:30px">' + (list.length > 1 ? '<button class="btn sm" data-hwrm="' + c.id + ':' + i2 + '">\u00d7</button>' : '') + '</td></tr>').join('') + '</tbody></table>' :
            '<div style="color:var(--mute);font-size:9.5px;padding:4px">NO MODELS YET \u2014 ADD ONE FROM ITS MCMASTER DRAWING.</div>') +
          '<div style="display:flex;gap:6px;margin-top:4px"><input data-hwnm="' + c.id + '" placeholder="NEW MODEL" style="width:200px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--ink);font:inherit;padding:3px 6px">' +
          '<input data-hwnum="' + c.id + '" placeholder="MCMASTER #" style="width:110px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--ink);font:inherit;padding:3px 6px">' +
          '<button class="btn sm" data-hwadd="' + c.id + '">+ ADD MODEL</button></div></div>'; }).join('');
    $('optBody').querySelectorAll('[data-hwdef]').forEach(el => el.onclick = () => { const [c2, i2] = el.dataset.hwdef.split(':');
      (M.hwDefault = M.hwDefault || {})[c2] = +i2; drawOpts(); });
    $('optBody').querySelectorAll('[data-hwmc]').forEach(el => el.onchange = () => { const [c2, i2] = el.dataset.hwmc.split(':');
      hwModels(c2)[+i2].mcm = el.value.trim(); });
    $('optBody').querySelectorAll('[data-hwrm]').forEach(el => el.onclick = () => { const [c2, i2] = el.dataset.hwrm.split(':');
      hwModels(c2).splice(+i2, 1); if (hwDefault(c2) >= hwModels(c2).length) (M.hwDefault = M.hwDefault || {})[c2] = 0; drawOpts(); });
    $('optBody').querySelectorAll('[data-hwadd]').forEach(el => el.onclick = () => { const c2 = el.dataset.hwadd;
      const nm = $('optBody').querySelector('[data-hwnm="' + c2 + '"]').value.trim(); if (!nm) return;
      hwModels(c2).push({ name: nm.toUpperCase(), mcm: $('optBody').querySelector('[data-hwnum="' + c2 + '"]').value.trim() }); drawOpts(); });
    return; }
  const J2 = M.opt.joinery || (M.opt.joinery = structuredClone(JOINERY));
  $('optBody').style.display = '';
  const grp = optTab === 'DRAWERS' ? M.opt.drawer : optTab === 'SHELVES' ? M.opt.shelf : optTab === 'JOINERY' ? J2 : optTab === 'GLIDES' ? (J2.glide || (J2.glide = structuredClone(JOINERY.glide))) : M.opt.door;
  $('optBody').innerHTML = OPT[optTab].map(([k, l, ty, os]) => ty === 'sel'
    ? '<div class="sec"><h3>' + l + '</h3><select data-k="' + k + '">' + os.map(o => '<option value="' + o[0] + '"' + (grp[k] === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>'
    : '<div class="sec"><h3>' + l + '</h3><input data-k="' + k + '" type="number" step="0.0001" value="' + (grp[k] == null ? '' : r3(grp[k])) + '"' + (grp[k] == null ? ' placeholder="auto"' : '') + '><div class="mm">' + (grp[k] == null ? '' : '= ' + (grp[k] * MM).toFixed(1) + ' mm') + '</div></div>').join('');
  $('optBody').querySelectorAll('input,select').forEach(i => i.onchange = () => { grp[i.dataset.k] = i.tagName === 'SELECT' ? i.value : (i.value === '' ? null : parseFloat(i.value)); drawOpts(); render(); });
}
$('optBtn').onclick = () => { drawOpts(); $('optModal').hidden = false; };
$('optClose').onclick = () => { $('optModal').hidden = true; };
$('optModal').addEventListener('click', e => { if (e.target === $('optModal')) $('optModal').hidden = true; });

/* ---------- PRESETS / NEW / SAVE / LOAD ---------- */
Object.entries(PRESETS).forEach(([k, p]) => { const o = document.createElement('option'); o.value = k; o.textContent = k + ' · ' + p.label; $('preset').appendChild(o); });
$('preset').onchange = () => { if (!$('preset').value) return; M = loadPreset($('preset').value); HIST.past = []; HIST.future = []; HIST.last = null; UI.sc = null; UI.sel = { kind: 'case' }; $('job').value = M.job; render(); };
$('undoBtn').onclick = undo; $('redoBtn').onclick = redo;
$('newBtn').onclick = () => { M = newCase(); HIST.past = []; HIST.future = []; HIST.last = null; UI.sc = null; UI.sel = { kind: 'case' }; $('preset').value = ''; $('job').value = M.job; render(); };
$('job').onchange = () => { M.job = $('job').value; };
$('saveBtn').onclick = () => {
  const doc = { format: 'CASEMAKER2', version: 1, build: '2026-09-03.35', saved: new Date().toISOString(), model: M };
  download((M.job || 'CASE').replace(/\s+/g, '_') + '_' + '2026-09-03.35'.slice(0, 10) + '.casemaker2', JSON.stringify(doc), 'application/json'); };
$('loadBtn').onclick = () => $('loadFile').click();
$('loadFile').onchange = e => { const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { try { const d = JSON.parse(t); if (d.format !== 'CASEMAKER2') throw new Error('not a CASEMAKER 2 file');
      M = d.model; UI.sel = { kind: 'case' }; UI.sc = null; $('job').value = M.job || 'NEW CASE'; render(); }
    catch (err) { alert('Could not load: ' + err.message); } }); e.target.value = ''; };

/* ---------- NEW-BUILD DETECTION ----------
   Served over http: the page re-reads itself every minute and compares build stamps.
   Opened from a file: the browser blocks reading files, so tabs tell each other instead -
   opening a newer build in any tab tells every older tab on this machine. */
const BUILD = '2026-09-03.35';
const newer = (a, b) => { if (!a || !b) return false; const [da, na] = a.split('.'), [db, nb] = b.split('.');
  return da > db || (da === db && (+na || 0) > (+nb || 0)); };
function showUpdate(build) { $('updateT').textContent = 'A NEW BUILD OF CASEMAKER IS AVAILABLE · ' + build + ' (YOU ARE ON ' + BUILD + ')'; $('update').classList.add('show'); }
$('updateGo').onclick = () => location.reload();
$('updateX').onclick = () => $('update').classList.remove('show');
try {
  const seen = localStorage.getItem('cm2.latestBuild');
  if (newer(seen, BUILD)) showUpdate(seen);
  if (!seen || newer(BUILD, seen)) localStorage.setItem('cm2.latestBuild', BUILD);
  addEventListener('storage', e => { if (e.key === 'cm2.latestBuild' && newer(e.newValue, BUILD)) showUpdate(e.newValue); });
} catch (_) { }
if (/^https?:/.test(location.protocol)) setInterval(() => {
  fetch(location.href, { cache: 'no-store' }).then(r => r.text()).then(t => {
    const m = t.match(/const BUILD = '([^']+)'/); if (m && newer(m[1], BUILD)) showUpdate(m[1]); }).catch(() => {});
}, 60000);

/* ---------- RENDER ---------- */
function render() {
  const planOn = UI.view === 'plan';
  $('plan').style.display = planOn ? 'block' : 'none'; $('partsView').style.display = planOn ? 'none' : 'block';
  document.querySelector('.tools').style.display = planOn ? '' : 'none';
  if (planOn) drawPlan(); else drawParts();
  drawIso(); inspector(); snapshot();
  $('undoBtn').disabled = !HIST.past.length; $('redoBtn').disabled = !HIST.future.length;
}
render();
</script>
